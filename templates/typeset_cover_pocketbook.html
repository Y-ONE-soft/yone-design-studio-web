{% extends "base.html" %}
{% block title %}포켓북 표지{% endblock %}

{% block content %}
<div class="page-header">
  <a href="/cover" class="back-link">표지 메뉴</a>
  <h1>포켓북 표지</h1>
  <p>분석본 일러스트(.ai)를 업로드하면 색상/풍경을 추출하여 포켓북 표지 PDF를 자동 생성합니다.</p>
</div>

<form id="typeset-form" class="upload-form" enctype="multipart/form-data">

  <!-- 분석본 .ai 업로드 -->
  <div class="section-label u-mb-4">분석본 일러스트 (.ai) <span class="required">*</span></div>
  <div class="drop-zone" id="pdf-drop"
       ondragover="event.preventDefault(); this.classList.add('dragover')"
       ondragleave="this.classList.remove('dragover')"
       ondrop="handleDrop(event)">
    <input type="file" name="analysis_pdfs" id="input-pdfs" accept=".ai" multiple
           onchange="handleFileSelect(this)">
    <div class="drop-label" id="drop-label">
      <span class="drop-icon">📎</span>
      <span class="drop-text">분석본 .ai 파일을 드래그하거나 클릭해서 선택 (여러 파일 가능)</span>
    </div>
  </div>
  <div id="file-list" class="file-list"></div>

  <button type="submit" class="run-btn" id="run-btn">
    <span class="btn-icon">&#9654;</span> 포켓북 표지 생성
  </button>
</form>

<!-- 진행 상태 -->
<div id="progress-area" class="progress-area hidden">
  <div class="progress-header">
    <h2>진행 상태</h2>
    <div class="step-indicators">
      <span class="step" id="step-parse">&#9312; 추출/생성</span>
      <span class="step-sep">&rarr;</span>
      <span class="step" id="step-verify">&#9313; 검수</span>
    </div>
  </div>
  <pre id="log-area" class="log-area"></pre>
</div>

<!-- 결과 -->
<div id="result-area" class="result-area hidden"></div>
{% endblock %}

{% block scripts %}
<script>
  const MATERIAL_ID = "cover_pocketbook";

  function handleFileSelect(input) {
    if (input.files.length > 0) showFiles(input.files);
  }

  function handleDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      document.getElementById('input-pdfs').files = files;
      showFiles(files);
    }
  }

  function showFiles(files) {
    const label = document.getElementById('drop-label');
    label.innerHTML = '<span class="drop-icon">&#9989;</span>' +
      '<span class="drop-text">' + files.length + '개 파일 선택됨</span>';
    document.getElementById('pdf-drop').classList.add('has-file');

    const listEl = document.getElementById('file-list');
    var html = '';
    for (var i = 0; i < files.length; i++) {
      var name = files[i].name;
      var school = name.split('_')[0];
      var size = (files[i].size / (1024*1024)).toFixed(1);
      html += '<div>' + school + ' &mdash; ' + name + ' (' + size + 'MB)</div>';
    }
    listEl.innerHTML = html;
  }

  // 폼 제출
  document.getElementById('typeset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const runBtn = document.getElementById('run-btn');

    runBtn.disabled = true;
    runBtn.textContent = '실행 중...';

    document.getElementById('progress-area').classList.remove('hidden');
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('result-area').innerHTML = '';
    document.getElementById('log-area').textContent = '';
    setStep(null);

    try {
      const res = await fetch('/api/run/' + MATERIAL_ID, { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok || data.error) {
        appendLog('[오류] ' + (data.error || '서버 오류'));
        resetBtn();
        return;
      }
      startStream(data.job_id);
    } catch (err) {
      appendLog('[오류] ' + err.message);
      resetBtn();
    }
  });

  // SSE
  function startStream(jobId) {
    const evtSource = new EventSource('/api/stream/' + jobId);
    evtSource.onmessage = (e) => {
      const msg = e.data;
      if (msg === '[DONE]') { evtSource.close(); fetchResult(jobId); return; }
      if (msg === '[PING]') return;
      appendLog(msg);
      updateStepFromLog(msg);
    };
    evtSource.onerror = () => {
      evtSource.close();
      appendLog('[연결 끊김] 결과를 확인합니다...');
      fetchResult(jobId);
    };
  }

  function updateStepFromLog(msg) {
    if (msg.indexOf('[1/2]') >= 0) setStep('parse');
    else if (msg.indexOf('[2/2]') >= 0) setStep('verify');
  }

  function setStep(active) {
    ['parse', 'verify'].forEach(function(s) {
      var el = document.getElementById('step-' + s);
      if (!el) return;
      el.classList.toggle('active', s === active);
      el.classList.toggle('done', active === 'verify' && s === 'parse');
    });
  }

  // 결과
  async function fetchResult(jobId) {
    resetBtn();
    try {
      const res = await fetch('/api/result/' + jobId);
      if (window.ResultSession && ResultSession.handle(res, jobId, showErrorCard)) return;  // 401 세션 만료 / 404 job 소멸
      const data = await res.json();
      if (window.ResultSession) ResultSession.clear();
      if (data.status === 'error' || !data.result) {
        showErrorCard((data.result && data.result.error) || '알 수 없는 오류');
        return;
      }
      showResultCard(jobId, data.result);
    } catch (err) { showErrorCard(err.message); }
  }

  function showResultCard(jobId, result) {
    const area = document.getElementById('result-area');
    area.classList.remove('hidden');
    const ok = result.ok;
    const warnings = result.warnings || [];

    var warnHtml = warnings.length
      ? '<ul class="warn-list">' + warnings.map(function(w){return '<li>'+w+'</li>'}).join('') + '</ul>'
      : '';

    area.innerHTML =
      '<div class="result-card ' + (ok ? 'ok' : 'warn') + '">' +
        '<div class="result-header">' +
          '<span class="result-badge">' + (ok ? '&#9989; 포켓북 표지 생성 완료' : '&#9888;&#65039; 확인 필요') + '</span>' +
        '</div>' +
        warnHtml +
        (result.pdf_path
          ? '<div class="action-row">' +
              '<a href="/download/' + jobId + '/pdf" class="download-btn">&#128229; PDF 다운로드</a>' +
            '</div>'
          : '<p class="no-pdf">PDF가 생성되지 않았습니다.</p>') +
      '</div>';
    setStep('verify');
  }

  function showErrorCard(msg) {
    const area = document.getElementById('result-area');
    area.classList.remove('hidden');
    area.innerHTML = '<div class="result-card error"><p>&#10060; 오류: ' + msg + '</p></div>';
  }

  function appendLog(msg) {
    const pre = document.getElementById('log-area');
    pre.textContent += msg + '\n';
    pre.scrollTop = pre.scrollHeight;
  }

  function resetBtn() {
    const btn = document.getElementById('run-btn');
    btn.disabled = false;
    btn.innerHTML = '<span class="btn-icon">&#9654;</span> 포켓북 표지 생성';
  }
</script>
<script src="{{ url_for('static', filename='js/result_session.js') }}"></script>
{% endblock %}
