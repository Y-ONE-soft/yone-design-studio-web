<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포켓북 지면</title>
<style>{{ font_css|safe }}</style>
<style>
  /* 포켓북 지면 보기(routes/pocketbook_view) — contents 포켓북이 iframe 으로 끼운다. 지문 하나 · 고른 면만. */
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #1f2430; background: #eef0f3; }
  #pages { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 10px; }
  #pages.busy { opacity: .55; }
  .p { width: calc(50% - 6px); min-width: 300px; }
  .p .lb { font-size: 11.5px; font-weight: 700; color: #6b7382; margin: 0 0 4px 2px; }
  .p .pg { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .p svg { display: block; width: 100%; height: auto; }
  .wait { padding: 60px 0; color: #6b7382; text-align: center; width: 100%; }
  .note { width: 100%; font-size: 12px; color: #8a5a00; background: #fff7e6; border-radius: 6px; padding: 6px 10px; }
</style>
</head>
<body>
<div id="pages"><div class="wait">지문을 고르면 포켓북 지면이 여기 그려집니다.</div></div>
<script src="/static/js/units_compose.js"></script>
<script>
const DESIGN = {{ design|tojson }};
const LABEL = {passage: "지문 면", flow: "FLOWNOTE", memo: "암기 TEST", answer: "암기 TEST 정답"};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
let parentOrigin = null, seq = 0;
const post = (m) => { if (window.parent !== window) window.parent.postMessage(m, parentOrigin && parentOrigin !== "null" ? parentOrigin : "*"); };
function postHeight() { post({type: "yos-pocketbook-height", h: Math.ceil(document.documentElement.scrollHeight)}); }

async function draw(src) {
  const my = ++seq;                                              // 빨리 바꿔 누르면 마지막 것만 그린다
  $("#pages").classList.add("busy");
  try {
    const r = await fetch("/pocketbook-view/render", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({design: DESIGN, src})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `스튜디오 ${r.status}`);
    if (my !== seq) return;
    const notes = (j.report && j.report.skipped || []).map(t => `<div class="note">${esc(t)}</div>`).join("");
    $("#pages").innerHTML = notes + (j.pages.length ? j.pages.map(p => `<div class="p"><div class="lb">${LABEL[p.face] || p.face}</div><div class="pg">${p.svg}</div></div>`).join("")
                                                    : `<div class="wait">고른 면이 없습니다.</div>`);
    $("#pages").querySelectorAll(".pg > svg").forEach((s) => { s.removeAttribute("width"); s.removeAttribute("height"); });
    if (document.fonts) await document.fonts.ready;
    if (window.unitsCompose) window.unitsCompose($("#pages"));
    post({type: "yos-pocketbook-drawn", faces: j.pages.map(p => p.face), skipped: (j.report && j.report.skipped) || []});
  } catch (e) {
    if (my === seq) $("#pages").innerHTML = `<div class="wait">${esc(e.message)}</div>`;
  } finally {
    if (my === seq) { $("#pages").classList.remove("busy"); postHeight(); }
  }
}

window.addEventListener("message", (e) => {
  if (e.source !== window.parent || !e.data || typeof e.data !== "object") return;
  parentOrigin = e.origin;
  if (e.data.type === "yos-pocketbook-load" && e.data.src) draw(e.data.src);
  if (e.data.type === "yos-pocketbook-hello") post({type: "yos-pocketbook-ready"});
});
addEventListener("resize", () => { clearTimeout(postHeight.t); postHeight.t = setTimeout(postHeight, 150); });
post({type: "yos-pocketbook-ready"});
</script>
</body>
</html>
