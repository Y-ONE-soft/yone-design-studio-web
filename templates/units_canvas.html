{% extends "base.html" %}
{% block title %}문서 만들기{% endblock %}
{% block theme %}light{% endblock %}
{% block content %}
<style>
  .cv { display: flex; height: 100vh; background: #ecebf3; color: #1f2330; font-size: 13px; user-select: none; }
  .cv h3 { font-size: 11.5px; color: var(--mute); margin: 14px 0 6px; font-weight: 600; letter-spacing: .04em; }
  .cv input[type=text], .cv input[type=number], .cv select, .cv textarea { box-sizing: border-box; background: #fff; color: var(--ink); border: 1px solid #cfc8e6; border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; background: var(--pp); color: #fff; border: 0; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .btn:hover { background: #6a1fd0; }
  .btn.sub { background: #f1f0f6; color: #1f2330; font-weight: 500; }
  .btn.sub:hover { background: #e2e0ec; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }
  .btn.danger { background: #fff; color: #c0263a; border: 1px solid #f0c4cb; }
  .btn:disabled { opacity: .45; cursor: default; }
  .note { color: var(--mute); font-size: 11.5px; line-height: 1.5; margin: 4px 0; }
  .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #eee; color: #555; vertical-align: middle; }
  .tag.b { background: #e9e0ff; color: #5b21b6; } .tag.p { background: #ffe9d6; color: #9a4b00; } .tag.a { background: #dcf3ea; color: #0f6b47; }

  /* 왼쪽 — 단위 탭 (원자·부품·블록·옷·세트·틀) */
  .left { display: flex; flex: none; background: #fff; border-right: 1px solid var(--line); }
  .utabs { width: 68px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: 6px; background: #fbfafd; }
  .utabs button { border: 0; background: transparent; padding: 10px 0 8px; cursor: pointer; font-size: 11px; color: #3c4043; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .utabs button .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; }
  .utabs button:hover .ic { background: #f1f0f6; }
  .utabs button.on { color: var(--pp); font-weight: 600; }
  .utabs button.on .ic { background: var(--pp-bg); }
  .utabs .lv { font-size: 9px; color: #a0a4b5; }
  .upanel { width: 262px; display: flex; flex-direction: column; }
  .upanel .hd { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
  .upanel .hd b { font-size: 13.5px; }
  .upanel .hd .note { margin: 2px 0 0; }
  .upanel .body { flex: 1; overflow: auto; padding: 4px 12px 16px; }
  .ai .box { display: flex; gap: 6px; margin-top: 8px; }
  .ai input { flex: 1; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 5px; background: #fff; cursor: pointer; }
  .card:hover { border-color: var(--pp); box-shadow: 0 2px 8px rgba(125,42,232,.15); }
  .card.on { border-color: var(--pp); background: var(--pp-bg); }
  .card .th { background: #f7f6fb; border-radius: 6px; overflow: hidden; height: 54px; display: flex; align-items: center; }
  .card .th svg { width: 100%; height: auto; display: block; }
  .card .nm { font-size: 11.5px; font-weight: 600; margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .ds { font-size: 10.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghost { position: fixed; z-index: 99; width: 120px; opacity: .85; pointer-events: none; box-shadow: 0 8px 24px rgba(30,20,60,.3); }
  .paper.dropok { outline: 3px solid var(--pp); outline-offset: -3px; }
  .atoms5 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .atoms5 button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 2px 4px; cursor: pointer; font-size: 10.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #3c4043; }
  .atoms5 button svg { width: 28px; height: 18px; }
  .atoms5 button:hover { border-color: var(--pp); }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); vertical-align: middle; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; }
  .colors label { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--mute); width: 44px; }
  .colors input[type=color] { width: 36px; height: 30px; border: 1px solid var(--line); border-radius: 8px; padding: 1px; background: #fff; cursor: pointer; }
  .li { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; margin: 5px 0; background: #fff; cursor: pointer; font-size: 12px; }
  .li:hover { border-color: var(--pp); } .li.on { border-color: var(--pp); background: var(--pp-bg); }
  .li .ds { color: var(--mute); font-size: 11px; margin-top: 2px; }
  .li .x { float: right; color: var(--mute); font-size: 11px; padding: 0 3px; } .li .x:hover { color: #c33; }
  .chip { display: inline-block; font-size: 10.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin: 2px 2px 0 0; cursor: pointer; background: #fff; }
  .chip:hover { border-color: var(--pp); color: var(--pp); }
  .upanel .ft { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11.5px; }

  /* 가운데 */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .stage .area { flex: 1; overflow: auto; padding: 64px 60px 40px; }
  .ptool { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; align-items: center; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(30,20,60,.16); padding: 5px 6px; z-index: 15; }
  .ptool input[type=text] { border: 0; width: 170px; font-weight: 600; padding: 4px 8px; }
  .ptool button { border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; color: #1f2330; white-space: nowrap; }
  .ptool button:hover { background: #f1eff8; }
  .ptool .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .ptool .st { font-size: 11px; color: var(--mute); padding: 0 8px; white-space: nowrap; }
  .ptool label { white-space: nowrap; }
  .paper { position: relative; margin: 0 auto; background: #fff; box-shadow: 0 3px 18px rgba(30,20,60,.18); }
  .paper .svgwrap svg { display: block; width: 100%; height: auto; }
  .paper .svgwrap svg g[data-fi] { cursor: move; }
  .paper .svgwrap svg g[data-fi]:hover { outline: 1.5px dashed #b39cf5; }
  .paper .svgwrap svg g.sel2 { outline: 2px dashed var(--pp); }
  .selbox { position: absolute; border: 2px solid var(--pp); border-radius: 2px; pointer-events: none; display: none; }
  .selbox .lb { position: absolute; left: -2px; top: -18px; font-size: 10px; background: var(--pp); color: #fff; padding: 1px 6px; border-radius: 4px 4px 0 0; white-space: nowrap; }
  .selbox span[data-h] { position: absolute; background: #fff; border: 2px solid var(--pp); border-radius: 4px; pointer-events: auto; }
  .selbox .hd-e { right: -6px; top: 50%; margin-top: -8px; width: 8px; height: 16px; cursor: ew-resize; }
  .selbox .hd-s { bottom: -6px; left: 50%; margin-left: -8px; width: 16px; height: 8px; cursor: ns-resize; }
  .selbox .hd-se { right: -6px; bottom: -6px; width: 10px; height: 10px; cursor: nwse-resize; }
  .selbox.multi { border-style: dashed; }
  .marq { position: absolute; border: 1.5px dashed var(--pp); background: rgba(125,42,232,.07); display: none; pointer-events: none; }
  .gv, .gh { position: absolute; background: #ff3ea5; display: none; pointer-events: none; }
  .gv { width: 1px; top: 0; bottom: 0; } .gh { height: 1px; left: 0; right: 0; }
  .tools .sep { width: 1px; height: 16px; background: #4a5068; margin: 0 2px; align-self: center; }
  .tools { position: absolute; display: none; gap: 3px; background: #1f2330; border-radius: 8px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 20; }
  .tools button { border: 0; background: transparent; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .tools button:hover { background: #3a3f52; }
  .tools button.x:hover { background: #c0263a; }
  .start { position: absolute; inset: 0; background: #ecebf3; z-index: 12; overflow: auto; padding: 40px 48px; }
  .start h2 { margin: 0 0 4px; font-size: 20px; }
  .start .sub { color: var(--mute); font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
  .start .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .pcard { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
  .pcard:hover { border-color: var(--pp); box-shadow: 0 6px 20px rgba(125,42,232,.14); }
  .pcard .th { background: #f7f6fb; border-radius: 8px; aspect-ratio: 210 / 297; overflow: hidden; display: flex; align-items: flex-start; }
  .pcard .th svg { width: 100%; height: auto; display: block; }
  .pcard .nm { font-weight: 700; margin-top: 8px; }
  .pcard .ds { color: var(--mute); font-size: 11.5px; margin-top: 2px; }
  .pcard.new { border-style: dashed; display: grid; place-items: center; min-height: 300px; color: var(--pp); font-weight: 700; font-size: 15px; }
  .guide { max-width: 560px; margin: 60px auto; background: #fff; border-radius: 16px; padding: 26px 30px; box-shadow: 0 6px 24px rgba(30,20,60,.1); }
  .guide h3 { font-size: 16px; margin: 0 0 12px; color: #1f2330; }
  .guide ol { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 13.5px; }
  .pv { position: absolute; inset: 0; background: #ecebf3; z-index: 14; display: flex; flex-direction: column; }
  .pv .pvbar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .pv .pvbar .note { flex: 1; }
  .pv .pvbody { flex: 1; overflow: auto; padding: 20px; display: flex; flex-wrap: wrap; gap: 18px; align-content: flex-start; justify-content: center; }
  .pv .sheet { width: 300px; background: #fff; box-shadow: 0 2px 10px rgba(30,20,60,.15); position: relative; }
  .pv .sheet svg { width: 100%; height: auto; display: block; }
  .pv .sheet .lb { position: absolute; left: 0; top: -16px; font-size: 11px; color: var(--mute); }
  .editbar { display: flex; gap: 10px; align-items: center; background: #1f2330; color: #fff; border-radius: 10px; padding: 8px 14px; margin: 0 auto 12px; max-width: 900px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .editbar .note { color: #c9cbe0; flex: 1; margin: 0; }
  .paper.editing .svgwrap svg g[data-fi]:not(.edt) { opacity: .25; pointer-events: none; }
  .warn { background: #fff7e6; border: 1px solid #f0d9a8; color: #6b4d00; border-radius: 8px; padding: 6px 10px; font-size: 12px; margin: 0 auto 12px; max-width: 760px; white-space: pre-wrap; }
  .empty { color: var(--mute); text-align: center; padding: 80px 20px; font-size: 14px; line-height: 1.7; }

  .strip { flex: none; background: #f4f3f9; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  .strip .rail { display: flex; gap: 10px; align-items: flex-end; padding: 12px 16px 6px; overflow-x: auto; }
  .pg { flex: none; width: 84px; position: relative; cursor: pointer; }
  .pg .th { background: #fff; border: 2.5px solid #e2e0ec; border-radius: 6px; aspect-ratio: 210 / 297; overflow: hidden; display: flex; align-items: flex-start; }
  .pg .th svg { width: 100%; height: auto; display: block; }
  .pg:hover .th { border-color: #b39cf5; }
  .pg.on .th { border-color: var(--pp); box-shadow: 0 0 0 2px rgba(125,42,232,.18); }
  .pg .no { position: absolute; left: 5px; bottom: 4px; font-size: 10.5px; color: #3c4043; background: rgba(255,255,255,.85); padding: 0 4px; border-radius: 4px; }
  .pg .pgact { position: absolute; right: 3px; top: 3px; display: none; gap: 2px; }
  .pg:hover .pgact { display: flex; }
  .pg .pgact button { border: 0; background: rgba(31,35,48,.85); color: #fff; font-size: 11px; width: 20px; height: 20px; border-radius: 5px; cursor: pointer; }
  .pg .pgact button:hover { background: #c0263a; }
  .pg .pgact button[data-pg-dup]:hover { background: var(--pp); }
  .pg.dragover .th { border-color: var(--pp); border-left-width: 6px; }
  .addpg { flex: none; width: 84px; aspect-ratio: 210 / 297; border: 2px dashed #cfc8e6; border-radius: 6px; background: #fff; display: grid; place-items: center; font-size: 26px; color: var(--pp); cursor: pointer; position: relative; }
  .addpg:hover { border-color: var(--pp); background: var(--pp-bg); }
  .menu { position: fixed; width: 190px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(30,20,60,.18); padding: 6px; z-index: 30; display: none; text-align: left; }
  .menu.on { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: #1f2330; }
  .menu button:hover { background: #f1eff8; }
  .menu button small { display: block; color: var(--mute); font-size: 10.5px; }
  .strip .foot { display: flex; align-items: center; gap: 12px; padding: 2px 16px 8px; font-size: 12px; color: var(--mute); }
  .strip .foot .cnt { margin-left: auto; font-weight: 600; color: #1f2330; }
  .strip .foot .help { cursor: help; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: #fff; }
  .strip .foot select { padding: 2px 4px; font-size: 11.5px; }
  .strip .foot .btn.sub.on { background: var(--pp-bg); color: var(--pp); }
  /* 손잡이 8 + 회전 */
  .selbox .hd { position: absolute; width: 9px; height: 9px; background: #fff; border: 2px solid var(--pp); border-radius: 3px; pointer-events: auto; box-sizing: border-box; }
  .selbox .hd[data-h="nw"] { left: -5px; top: -5px; cursor: nwse-resize; } .selbox .hd[data-h="n"] { left: 50%; margin-left: -5px; top: -5px; cursor: ns-resize; } .selbox .hd[data-h="ne"] { right: -5px; top: -5px; cursor: nesw-resize; }
  .selbox .hd[data-h="w"] { left: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; } .selbox .hd[data-h="e"] { right: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  .selbox .hd[data-h="sw"] { left: -5px; bottom: -5px; cursor: nesw-resize; } .selbox .hd[data-h="s"] { left: 50%; margin-left: -5px; bottom: -5px; cursor: ns-resize; } .selbox .hd[data-h="se"] { right: -5px; bottom: -5px; cursor: nwse-resize; }
  .selbox .rot { position: absolute; left: 50%; top: -26px; margin-left: -6px; width: 12px; height: 12px; border: 2px solid var(--pp); border-radius: 50%; background: #fff; pointer-events: auto; cursor: grab; box-sizing: border-box; }
  .selbox .rot::before { content: ""; position: absolute; left: 4px; top: 10px; width: 2px; height: 10px; background: var(--pp); }
  .selbox .lb { top: -18px; left: auto; right: -2px; }
  .selbox.multi .hd, .selbox.multi .rot { display: none; }
  /* 자 · 안내선 · 격자 · 여백 */
  .ruler { position: absolute; background: #fbfafd; color: #8b91a5; font-size: 9px; display: none; user-select: none; }
  .paper.rulers .ruler { display: block; }
  .ruler.rt { left: 0; right: 0; top: -18px; height: 18px; border-bottom: 1px solid #d8d5e6; cursor: row-resize; }
  .ruler.rl { top: 0; bottom: 0; left: -18px; width: 18px; border-right: 1px solid #d8d5e6; cursor: col-resize; }
  .guide { position: absolute; background: #00b8d9; opacity: .8; z-index: 5; }
  .guide.v { top: 0; bottom: 0; width: 1px; cursor: col-resize; padding: 0 3px; margin-left: -3px; background-clip: content-box; }
  .guide.h { left: 0; right: 0; height: 1px; cursor: row-resize; padding: 3px 0; margin-top: -3px; background-clip: content-box; }
  .paper.grid .svgwrap { background-image: linear-gradient(to right, rgba(125,42,232,.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(125,42,232,.12) 1px, transparent 1px); }
  .margins { position: absolute; border: 1px dashed #f0a441; pointer-events: none; display: none; }
  .paper.mg .margins { display: block; }
  .area.pan { cursor: grab; } .area.pan:active { cursor: grabbing; }
  .paper .svgwrap svg g[data-lock] { pointer-events: none; }
  .paper .svgwrap svg g[data-lock].sel2, .paper .svgwrap svg g.lk-sel { outline: 2px dashed #f0a441; }
  /* 글 바로 고치기 */
  .tedit { position: absolute; z-index: 30; border: 2px solid var(--pp); border-radius: 2px; background: rgba(255,255,255,.95); padding: 0; margin: 0; resize: none; overflow: hidden; line-height: 1.45; font-family: inherit; box-sizing: border-box; }
  /* 오른쪽 클릭 메뉴 · 레이어 */
  .cmenu { position: fixed; z-index: 100; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(30,20,60,.2); padding: 5px; min-width: 180px; display: none; }
  .cmenu button { display: flex; width: 100%; border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; text-align: left; color: #1f2330; }
  .cmenu button:hover { background: #f1eff8; } .cmenu button span { margin-left: auto; color: #a0a4b5; font-size: 11px; }
  .cmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .layers .li { display: flex; align-items: center; gap: 6px; padding: 4px 6px; margin: 2px 0; cursor: pointer; }
  .layers .li.on { border-color: var(--pp); background: var(--pp-bg); }
  .layers .li .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layers .li button { border: 0; background: transparent; cursor: pointer; font-size: 12px; padding: 0 2px; color: #7a6aa8; opacity: .6; }
  .layers .li button.on { opacity: 1; color: #1f2330; }
  .layers .li.hid .nm { opacity: .4; text-decoration: line-through; }
  .strip .foot input[type=range] { width: 140px; }

  /* 오른쪽 — 고른 것의 단위 사슬 */
  .side { width: 262px; flex: none; background: #fff; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .side .hd { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .side .body { flex: 1; overflow: auto; padding: 4px 14px 16px; }
  .chain { border-left: 2px solid #e2e0ec; margin: 8px 0 8px 6px; padding-left: 10px; }
  .chain div { position: relative; font-size: 12px; margin: 5px 0; }
  .chain div::before { content: ""; position: absolute; left: -15px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: #cfc8e6; }
  .chain div.cur::before { background: var(--pp); }
  .chain a { color: var(--pp); }
  .f { display: grid; grid-template-columns: 62px 1fr; gap: 6px; align-items: center; margin: 6px 0; font-size: 12px; color: var(--mute); }
  .f input, .f select { width: 100%; }
  .m3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .m3 label { font-size: 10.5px; color: var(--mute); }
  .m3 input, .m3 select { width: 100%; padding: 4px 5px; }
  .m4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .m4 label { font-size: 10.5px; color: var(--mute); }
  .m4 input { width: 100%; padding: 4px 5px; }
</style>

<div class="cv">
  <!-- 왼쪽: 단위 탭 -->
  <div class="left">
    <div class="utabs">
      <button data-tab="blocks" class="on"><span class="ic">🧩</span>요소</button>
      <button data-tab="skins"><span class="ic">🎨</span>브랜드</button>
      <button data-tab="sets"><span class="ic">📝</span>원고</button>
      <div style="flex:1"></div>
      <button data-tab="plans"><span class="ic">📚</span>문서</button>
    </div>
    <div class="upanel">
      <div class="hd" id="phd"></div>
      <div class="body" id="pbody"></div>
      <div class="ft"><a href="/units/library">PDF·그림에서 요소 뽑기 · 고급(JSON) →</a></div>
    </div>
  </div>

  <!-- 가운데 -->
  <div class="stage">
    <div class="ptool">
      <button id="p-home" title="내 문서">←</button>
      <input type="text" id="plname" placeholder="문서 이름" style="width:170px;color:var(--pp)">
      <span class="sep"></span>
      <select id="skin" title="브랜드 (색·서체)"></select>
      <span class="sep"></span>
      <button id="p-preview" title="원고를 넣은 책 전체">📖 미리보기</button>
      <button id="p-pdf" title="PDF 저장">⬇ PDF</button>
      <span class="sep"></span>
      <button id="p-dup" title="페이지 복제">⧉</button>
      <button id="p-del" title="페이지 지우기">🗑</button>
      <input type="text" id="pname" placeholder="페이지 이름" style="display:none">
      <span class="st" id="st"></span>
    </div>

  <!-- 오른쪽 -->

{% block scripts %}
<script>
const LIB = {{ library_json | safe }};
const $ = (s) => document.querySelector(s);
const api = async (url, body, method) => {
  const r = await fetch(url, {method: method || (body ? "POST" : "GET"), headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({error: r.status + " " + r.statusText}));
  if (!r.ok && !j.error) j.error = r.status + " " + r.statusText;
  return j;
};
const byId = (k) => Object.fromEntries((LIB[k] || []).map(x => [x.id, x]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const snap = (v) => Math.round(v * 2) / 2;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const M = {left: 20, right: 20, top: 44, bottom: 20};
const GROUPS = [["지문", ["B1", "B2", "B3", "B7"]], ["문항", ["B6"]], ["드릴", ["B5", "B8"]], ["머리 · 꼬리 · 간지 · 표지", ["B10", "B11"]]];
const ATOMS = [
  ["text", "글상자", {t: "text", x: 0, y: 0, w: 80, h: 6, font: "$body", size: 9, color: "$ink", text: "글상자 — 오른쪽에서 글·크기·색을"}],
  ["line", "선", {t: "line", x1: 0, y1: 0, x2: 80, y2: 0, stroke: {w: 0.5, color: "$rule"}}],
  ["rect", "면", {t: "rect", x: 0, y: 0, w: 60, h: 20, fill: "$cream", radius: 1}],
  ["ellipse", "원", {t: "ellipse", x: 0, y: 0, w: 10, h: 10, stroke: {w: 0.5, color: "$sel"}}],
  ["image", "그림", {t: "image", x: 0, y: 0, w: 40, h: 30, src: "img1"}],
  ["path", "도형", {t: "path", x: 0, y: 0, w: 12, h: 8, d: "M0 0.3 L0.6 0.3 L0.6 0 L1 0.5 L0.6 1 L0.6 0.7 L0 0.7 Z", fill: "$sel"}],
];
const ATOM_NM = Object.fromEntries(ATOMS.map(a => [a[0], a[1]]));
// 도형 견본 — 좌표는 0~1 비율. 인디자인 Polygon·펜 패스 대신 여기서 고르거나 d 를 직접 적는다
const SHAPES = {"화살표 →": "M0 0.3 L0.6 0.3 L0.6 0 L1 0.5 L0.6 1 L0.6 0.7 L0 0.7 Z", "삼각형": "M0.5 0 L1 1 L0 1 Z", "체크": "M0.05 0.55 L0.35 0.9 L0.95 0.1",
  "별": "M0.5 0 L0.62 0.38 L1 0.38 L0.69 0.6 L0.81 1 L0.5 0.76 L0.19 1 L0.31 0.6 L0 0.38 L0.38 0.38 Z", "말풍선": "M0.1 0 L0.9 0 C0.95 0 1 0.05 1 0.1 L1 0.65 C1 0.7 0.95 0.75 0.9 0.75 L0.35 0.75 L0.2 1 L0.22 0.75 L0.1 0.75 C0.05 0.75 0 0.7 0 0.65 L0 0.1 C0 0.05 0.05 0 0.1 0 Z",
  "마름모": "M0.5 0 L1 0.5 L0.5 1 L0 0.5 Z", "육각형": "M0.25 0 L0.75 0 L1 0.5 L0.75 1 L0.25 1 L0 0.5 Z"};
const plainText = (t) => Array.isArray(t) ? t.map(r => typeof r === "string" ? r : (r.t || "")).join("") : (t || "");

let plan = null, page = null, sel = null, sels = new Set(), scale = 3, zoom = 1, thumbs = {blocks: {}, parts: {}}, pageSvg = {}, curSet = "";
// 틀 = 문서. 아래 띠·←/→·＋ 는 전부 이 틀의 지면 순서 위에서 움직인다. 지면 자체는 라이브러리(공유)에 있다.
function planIds(pl) { const ids = [...(pl.front || [])]; for (const sc of pl.sections || []) { if (sc.divider) ids.push(sc.divider); for (const pg of sc.pages || []) ids.push(pg.page); } ids.push(...(pl.back || [])); return ids; }
function docPages() { return plan ? planIds(plan).map(id => byId("pages")[id]).filter(Boolean) : []; }
function setPlanIds(ids) { const s0 = (plan.sections || [])[0] || {id: "s1", name: "본문"}; plan.front = []; plan.back = []; plan.sections = [{id: s0.id, name: s0.name, pages: ids.map(id => ({page: id, repeat: "once"}))}]; }
async function savePlan() { if (!plan) return; const j = await api("/api/units/plans", plan); if (j.error) $("#st").textContent = "틀 저장 실패: " + j.error; }
function usedElsewhere(pid) { return LIB.plans.some(pl => pl !== plan && planIds(pl).includes(pid)); }
let tab = new URLSearchParams(location.search).get("tab") || "blocks";      // ?tab=atoms 로 바로 열기
const specOf = (p) => byId("specs")[(p || page || {}).spec] || byId("specs").a4 || {w: 210, h: 297};
const skin = () => byId("skins")[$("#skin").value] || LIB.skins[0];
const idx = () => docPages().findIndex(x => page && x.id === page.id);
const unitOf = (it) => it.atom ? "atom" : (it.block ? "block" : "part");
const nameOf = (it) => it.atom ? ATOM_NM[it.atom.t] : it.block ? (byId("blocks")[it.block] || {name: it.block}).name : ((byId("parts")[it.part] || {name: it.part}).name + " (그룹)");
const partOfBlock = (bid) => { const b = byId("blocks")[bid]; if (!b) return null; const v = (b.variants || []).find(v => v.id === (skin().variants || {})[bid]) || b.variants[0]; return v && byId("parts")[v.part]; };

// ── 지면 만들기 · 순서 · 지우기 — 이 틀 안에서 ──
function newPage(kind) {
  let n = 1; while (byId("pages")["page_" + n]) n++;
  const S = specOf(); const p = {id: "page_" + n, name: "", spec: (plan && plan.spec) || (page && page.spec) || "a4", mirror: true, zones: [], items: []};
  if (kind === "dup" && page) { const d = clone(page); d.id = "page_" + n; d.name = (page.name || page.id) + " 복사"; return d; }
  p.name = {body: "본문", blank: "빈 면", divider: "간지", cover: "표지"}[kind] + " " + n;
  if (kind === "body") { if (byId("blocks").running_head) p.items.push({block: "running_head", x: M.left, y: 14}); if (byId("blocks").folio) p.items.push({block: "folio", x: M.left, y: S.h - 19}); }
  if (kind === "divider" || kind === "cover") { p.mirror = false; if (byId("blocks")[kind]) p.items.push({block: kind, x: 0, y: 0}); }
  return p;
}
async function addPage(kind) {
  if (!plan) return; const p = newPage(kind); if (!p) return;
  const j = await api("/api/units/pages", p); if (j.error) { $("#st").textContent = j.error; return; }
  LIB.pages.push(p);
  const ids = planIds(plan); const i = page ? ids.indexOf(page.id) : -1; ids.splice(i + 1, 0, p.id); setPlanIds(ids); await savePlan();
  open(p);
}
async function movePageTo(fromId, toIndex) {
  const ids = planIds(plan); const i = ids.indexOf(fromId); if (i < 0) return;
  ids.splice(i, 1); ids.splice(Math.max(0, Math.min(toIndex, ids.length)), 0, fromId); setPlanIds(ids); await savePlan(); drawRail(); side();
}
$("#p-dup").onclick = () => addPage("dup");
async function deletePage(p) {
  p = p || page; if (!p || !plan) return;
  const n = (p.items || []).length; const shared = usedElsewhere(p.id);
  if (!confirm(`페이지 「${p.name || p.id}」 을 지울까?${n ? ` (요소 ${n}개도 함께)` : ""}${shared ? "\n다른 문서에서도 쓰는 페이지라 라이브러리엔 남는다." : ""}`)) return;
  const ids = planIds(plan); const i = ids.indexOf(p.id); ids.splice(i, 1); setPlanIds(ids); await savePlan();
  if (!shared) { await api("/api/units/pages", {id: p.id}, "DELETE"); LIB.pages = LIB.pages.filter(x => x.id !== p.id); delete pageSvg[p.id]; }
  const dp = docPages();
  if (!page || p.id === page.id) { if (dp.length) open(dp[Math.min(Math.max(i, 0), dp.length - 1)]); else { page = null; $("#svgwrap").innerHTML = ""; drawRail(); $("#side").innerHTML = ""; emptyGuide(); } }
  else drawRail();
}
$("#p-del").onclick = () => deletePage();

// ── 틀(문서) 고르기 · 만들기 ──
function openPlan(pl) {
  plan = byId("plans")[pl.id] || pl; page = null; sel = null; sels = new Set();
  $("#start").style.display = "none"; $(".ptool").style.display = ""; $("#plname").value = plan.name || plan.id;
  const dp = docPages(); const want = new URLSearchParams(location.search).get("page") || decodeURIComponent(location.hash.replace(/^#/, ""));   // ?page= 도 받는다(# 를 못 넘기는 곳)
  history.replaceState(null, "", "?plan=" + encodeURIComponent(plan.id) + (want ? "#" + want : ""));
  if (dp.length) open(dp.find(x => x.id === want) || dp[0]); else { $("#svgwrap").innerHTML = ""; drawRail(); $("#side").innerHTML = ""; emptyGuide(); }
  panel();
}
function emptyGuide() {
  $("#paper").style.width = "auto"; $("#paper").style.height = "auto"; $("#paper").style.background = "transparent"; $("#paper").style.boxShadow = "none";
  $("#svgwrap").innerHTML = `<div class="guide" style="text-align:center"><button class="btn" id="g-first">＋ 페이지</button></div>`;
  $("#g-first").onclick = () => addPage("body");
}
async function showStart() {
  plan = null; page = null; history.replaceState(null, "", location.pathname);
  const box = $("#start"); box.style.display = ""; $(".ptool").style.display = "none"; $("#side").innerHTML = ""; $("#stitle").textContent = ""; $("#rail").innerHTML = ""; $("#cnt").textContent = "";
  box.innerHTML = `<h2>내 문서</h2><div class="cards" id="pcards"></div>`;
  const cards = $("#pcards");
  const nw = document.createElement("div"); nw.className = "pcard new"; nw.textContent = "＋ 새 문서"; nw.onclick = newPlan; cards.appendChild(nw);
  for (const pl of LIB.plans) {
    const d = document.createElement("div"); d.className = "pcard"; const ids = planIds(pl);
    d.innerHTML = `<div class="th"></div><div class="nm">${esc(pl.name || pl.id)}</div><div class="ds">페이지 ${ids.length} · ${pl.spec || "a4"}</div>`;
    d.onclick = () => openPlan(pl); cards.appendChild(d);
    const first = byId("pages")[ids[0]];
    if (first) { const j = await api("/api/units/preview", {kind: "pages", item: first, skin: $("#skin").value, mode: "canvas", spec: first.spec}); const th = d.querySelector(".th"); th.innerHTML = ((j.svgs || [])[0] || {}).svg || ""; strip(th); }
  }
}
async function newPlan() {
  const name = prompt("문서 이름 (예: 워크북 · 파이널 · 단어장)", "새 문서"); if (name == null) return;
  let n = 1; while (byId("plans")["plan_" + n]) n++;
  const pl = {id: "plan_" + n, name, spec: "a4", front: [], sections: [{id: "s1", name: "본문", pages: []}], back: []};
  const j = await api("/api/units/plans", pl); if (j.error) { alert(j.error); return; }
  LIB.plans.push(pl); openPlan(pl); await addPage("body");                 // 캔바처럼 1쪽이 바로 있다
}
$("#p-home").onclick = showStart;
$("#plname").oninput = () => { if (plan) { plan.name = $("#plname").value; clearTimeout(window._plt); window._plt = setTimeout(savePlan, 500); } };
// 책 미리보기 · PDF
$("#p-pdf").onclick = () => { if (plan) window.open(`/api/units/pdf?plan=${encodeURIComponent(plan.id)}&skin=${encodeURIComponent($("#skin").value)}`, "_blank"); };
$("#p-preview").onclick = async () => {
  if (!plan) return; const pv = $("#pv"); pv.style.display = ""; $("#pvtitle").textContent = plan.name || plan.id; $("#pvinfo").textContent = "그리는 중…"; $("#pvbody").innerHTML = "";
  $("#pvpdf").href = `/api/units/pdf?plan=${encodeURIComponent(plan.id)}&skin=${encodeURIComponent($("#skin").value)}`;
  const j = await api("/api/units/preview", {kind: "plans", item: plan, skin: $("#skin").value});
  if (j.error) { $("#pvinfo").textContent = j.error; return; }
  $("#pvinfo").textContent = `${j.svgs.length}면 · 원고 ${LIB.sets.length}개를 넣은 모습` + ((j.warnings || []).length ? ` · 경고 ${j.warnings.length}: ${j.warnings[0]}` : "");
  for (const sh of j.svgs) { const d = document.createElement("div"); d.className = "sheet"; d.innerHTML = `<span class="lb">${esc(sh.label || "")} · ${sh.page_no}쪽</span>${sh.svg}`; strip(d); $("#pvbody").appendChild(d); }
};
$("#pvclose").onclick = () => { $("#pv").style.display = "none"; };

// ── 열기 · 그리기 ──
function open(p) {
  page = byId("pages")[p.id] || p; sel = null; sels = new Set();
  if (!page.items) page.items = [];
  editing = null; $("#paper").classList.remove("editing"); $("#editbar").style.display = "none"; page.items.forEach(it => delete it._edit);
  if (page.chrome && page.chrome.length) { page.items = page.chrome.map(c => ({part: c.part, x: c.x, y: c.y})).concat(page.items); delete page.chrome; }
  $("#pname").value = page.name || ""; history.replaceState(null, "", (plan ? "?plan=" + encodeURIComponent(plan.id) : "") + "#" + page.id); applyView();
  const pp = $("#paper"); pp.style.background = ""; pp.style.boxShadow = "";
  drawRail(); layout(); render(); side();
  const el = document.querySelector(`.pg[data-id="${page.id}"]`); if (el) el.scrollIntoView({inline: "nearest", block: "nearest"});
}
function layout() {
  const sp = specOf(); const fit = Math.min(4.5, ($("#area").clientWidth - 140) / sp.w);           // 기본 = 폭 맞춤(양옆 회색 여유 — 거기서 범위 선택 시작). 세로는 스크롤
  scale = fit * zoom;
  const paper = $("#paper"); paper.style.width = (sp.w * scale) + "px"; paper.style.height = (sp.h * scale) + "px";
  drawRulers();
}
window.addEventListener("resize", () => { if (page) { layout(); selbox(); } });
function setZoom(z) { zoom = Math.max(0.3, Math.min(3, z)); $("#zoom").value = Math.round(zoom * 100); $("#zoomv").textContent = Math.round(zoom * 100) + "%"; layout(); selbox(); }
$("#zoom").oninput = () => setZoom($("#zoom").value / 100);
$("#zoomv").onclick = () => setZoom(1);
$("#zoomfit").onclick = () => { const sp = specOf(); setZoom((($("#area").clientHeight - 60) / sp.h) / (($("#area").clientWidth - 60) / sp.w)); };
$("#area").addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9)); } }, {passive: false});
let rt = null;
function render() {
  if (!page) return;
  clearTimeout(rt);
  rt = setTimeout(async () => {
    const j = await api("/api/units/preview", {kind: "pages", item: page, skin: $("#skin").value, mode: "canvas", spec: page.spec, set: curSet});
    const w = $("#warn");
    if (j.error) { w.style.display = ""; w.textContent = j.error; return; }
    const svg = (j.svgs[0] || {}).svg || "";
    $("#svgwrap").innerHTML = svg; strip($("#svgwrap"));
    pageSvg[page.id] = svg; const th = document.querySelector(`.pg[data-id="${page.id}"] .th`); if (th) { th.innerHTML = svg; strip(th); }
    w.style.display = (j.warnings || []).length ? "" : "none"; w.textContent = (j.warnings || []).join("\n");
    wire(); selbox();
  }, 40);
}
function strip(box) { const s = box.querySelector("svg"); if (s) { s.removeAttribute("width"); s.removeAttribute("height"); } }

// ── 아래 지면 띠 ──
let dragId = null;
async function drawRail() {
  const rail = $("#rail"); rail.innerHTML = ""; const dp = docPages();
  dp.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "pg" + (page && p.id === page.id ? " on" : ""); d.dataset.id = p.id; d.draggable = true; d.title = p.name || p.id;
    d.innerHTML = `<div class="th">${pageSvg[p.id] || ""}</div><span class="no">${i + 1}</span><span class="pgact"><button data-pg-dup title="이 지면 복제">⧉</button><button data-pg-del title="이 지면 지우기">✕</button></span>`; strip(d);

function enterEdit(i) {

  select([i]); ungroup(); if (it.block) ungroup();                     // 블록 → 그룹 → 원자들 (자리 그대로)

    if (e.button !== 0) return; const sx = e.clientX, sy = e.clientY; let ghost = null;

      ghost.style.left = (ev.clientX + 8) + "px"; ghost.style.top = (ev.clientY + 8) + "px";
      $("#paper").classList.toggle("dropok", !!over(ev)); };
    const up = (ev) => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up);
      if (!ghost) return; ghost.remove(); $("#paper").classList.remove("dropok"); setTimeout(() => { el._dragging = false; }, 0);

      if (payload.k === "block") addBlock(payload.id, at); else if (payload.k === "part") addPart(payload.id, at); else if (payload.k === "atom") addAtom(payload.id, at); };
    const over = (ev) => { const r = $("#paper").getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom ? r : null; };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);

}

      $("#pl-del").onclick = async () => { if (!confirm(`문서 「${plan.name || plan.id}」 을 지울까? (페이지는 남는다)`)) return; await api("/api/units/plans", {id: plan.id}, "DELETE"); LIB.plans = LIB.plans.filter(x => x.id !== plan.id); showStart(); }; }
  }
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; panel(); });
async function makeByPrompt() {
  const inp = $("#ai"); const prompt = inp.value.trim(); if (!prompt || !page) return;
  $("#btn-ai").disabled = true; $("#ainote").style.display = ""; $("#ainote").textContent = "그리는 중… (15초쯤)";
  const j = await api("/api/units/make", {prompt, skin: $("#skin").value});
  if (j.error) { $("#btn-ai").disabled = false; $("#ainote").textContent = j.error; return; }
  const lj = await api("/api/units/library"); LIB.blocks = lj.blocks; LIB.parts = lj.parts; LIB.skins = lj.skins;
  await thumbsLoad(); addBlock(j.block.id); $("#ainote").style.display = "none"; $("#btn-ai").disabled = false;
}

// ── 오른쪽: 고른 것의 단위 사슬 ──
function side() {
  const box = $("#side"); if (!page) { box.innerHTML = ""; return; }
  let h = ""; const sk = skin();
  const colorSel = (k, cur, none) => `<select data-a="${k}">${none ? `<option value="">없음</option>` : ""}${Object.entries(sk.tokens.color || {}).map(([n, v]) => `<option value="$${n}" ${cur === "$" + n ? "selected" : ""}>${n} ${v}</option>`).join("")}</select>`;
  if (sel != null && page.items[sel]) {
    const it = page.items[sel]; const u = unitOf(it);
    $("#stitle").textContent = nameOf(it);
    if (u === "block") {
      const blk = byId("blocks")[it.block] || {variants: []}; const part = partOfBlock(it.block); const cur = (sk.variants || {})[it.block] || (blk.variants[0] || {}).id;
      const flds = Object.keys(blk.fields || {});
      h += `<div class="note">${flds.length ? `원고 자리: <b>${flds.join(", ")}</b>` : (blk.source === "system" ? "자동 (쪽번호·구간명)" : "장식")}</div>
        ${(blk.variants || []).length > 1 ? `<div class="f"><span>모양</span><select id="var">${(blk.variants || []).map(v => `<option value="${v.id}" ${v.id === cur ? "selected" : ""}>${esc(v.name || v.id)}</option>`).join("")}</select></div>` : ""}
        <div class="row"><button class="btn sm" id="s-edit" title="더블클릭과 같다">✎ 편집</button><button class="btn sm sub" id="s-down" title="이 페이지에서만 낱개로 푼다">그룹 해제</button></div>`;
    } else if (u === "part") {
      const part = byId("parts")[it.part] || {atoms: []};
      h += `<div class="note">그룹 · ${part.atoms.length}개</div>
        <div class="row"><button class="btn sm" id="s-toblock">★ 요소로 저장</button><button class="btn sm sub" id="s-down">그룹 해제</button></div>`;
    } else {
      const a = it.atom;
      h += `<div class="row">${sels.size > 1 ? `<button class="btn sm sub" id="s-group">그룹 (Ctrl+G)</button>` : ""}<button class="btn sm" id="s-toblock2">★ 요소로 저장</button></div>${sels.size > 1 ? `` : ""}`;
      if (a.t === "text") h += `<div class="f"><span>글</span><textarea data-a="text" rows="3">${esc(plainText(a.text))}</textarea></div>${Array.isArray(a.text) ? `<div class="note">서식이 섞인 글(굵게·기울임·다른 색). 여기서 고치면 서식은 사라진다.</div>` : ""}
        <div class="f"><span>자리 이름</span><input type="text" data-a="bind" value="${esc(a.bind || "")}" placeholder="예: passage · prompt · no" title="원고가 들어올 자리. 비우면 고정 글"></div>
        <div class="f"><span>서체</span><select data-a="font">${Object.entries(sk.tokens.font || {}).map(([n, v]) => `<option value="$${n}" ${a.font === "$" + n ? "selected" : ""}>${n} — ${esc(v)}</option>`).join("")}</select></div>
        <div class="f"><span>크기 pt</span><input type="number" data-a="size" step="0.5" value="${a.size}"></div>
        <div class="f"><span>색</span>${colorSel("color", a.color)}</div>
        <div class="f"><span>정렬</span><select data-a="align">${["left", "center", "right", "justify"].map(v => `<option ${a.align === v ? "selected" : ""}>${v}</option>`).join("")}</select></div>
        <div class="m3"><label>높이 mm<input type="number" data-a="h" step="0.5" value="${a.h}"></label><label>행간 pt<input type="number" data-a="leading" step="0.5" value="${a.leading || ""}" placeholder="자동"></label><label>자간 ‰<input type="number" data-a="tracking" step="10" value="${a.tracking || 0}"></label></div>
        <div class="m3"><label>들여쓰기<input type="number" data-a="indent" step="0.5" value="${a.indent || 0}"></label><label>첫 줄<input type="number" data-a="indent_first" step="0.5" value="${a.indent_first || 0}" title="음수 = 내어쓰기"></label><label>오른쪽<input type="number" data-a="indent_right" step="0.5" value="${a.indent_right || 0}"></label></div>
        <div class="m3"><label>단락 앞<input type="number" data-a="space_before" step="0.5" value="${a.space_before || 0}"></label><label>단락 뒤<input type="number" data-a="space_after" step="0.5" value="${a.space_after || 0}"></label><label>안쪽 여백<input type="number" data-a="inset" step="0.5" value="${Array.isArray(a.inset) ? a.inset[0] : (a.inset || 0)}"></label></div>
        <div class="m3"><label>세로 정렬<select data-a="valign">${[["top", "위"], ["center", "가운데"], ["bottom", "아래"]].map(([v, n]) => `<option value="${v}" ${(a.valign || "top") === v ? "selected" : ""}>${n}</option>`).join("")}</select></label><label>단 수<input type="number" data-a="columns" min="1" max="6" step="1" value="${a.columns || 1}"></label><label>단 간격<input type="number" data-a="gutter" step="0.5" value="${a.gutter || 0}"></label></div>
`;
      else if (a.t === "line") h += `<div class="f"><span>길이 mm</span><input type="number" data-a="x2" step="0.5" value="${a.x2}"></div><div class="f"><span>굵기 pt</span><input type="number" data-a="stroke.w" step="0.1" value="${(a.stroke || {}).w || 0.5}"></div>
        <div class="f"><span>색</span>${colorSel("stroke.color", (a.stroke || {}).color)}</div><div class="f"><span>점선</span><input type="checkbox" data-a="dash" ${(a.stroke || {}).dash ? "checked" : ""}></div>
        <div class="f"><span>선 끝</span><select data-a="stroke.cap">${["butt", "round", "square"].map(v => `<option value="${v}" ${((a.stroke || {}).cap || "butt") === v ? "selected" : ""}>${({butt: "자름", round: "둥글게", square: "네모"})[v]}</option>`).join("")}</select></div>`;
      else if (a.t === "rect" || a.t === "ellipse" || a.t === "path") h += `<div class="m3"><label>폭<input type="number" data-a="w" step="0.5" value="${a.w}"></label><label>높이<input type="number" data-a="h" step="0.5" value="${a.h}"></label>${a.t === "rect" ? `<label>모서리<input type="number" data-a="radius" step="0.5" value="${a.radius || 0}"></label>` : ""}</div>
        ${a.t === "path" ? `<div class="f"><span>모양</span><select data-a="d"><option value="">직접</option>${Object.entries(SHAPES).map(([n, d]) => `<option value="${d}" ${a.d === d ? "selected" : ""}>${n}</option>`).join("")}</select></div><div class="f"><span>경로 d</span><input type="text" data-a="d" value="${esc(a.d || "")}" placeholder="M L C Q Z · 0~1 비율"></div>` : ""}
        <div class="f"><span>채움</span>${colorSel("fill", a.fill, true)}</div><div class="f"><span>테두리</span>${colorSel("stroke.color", (a.stroke || {}).color, true)}</div><div class="f"><span>굵기 pt</span><input type="number" data-a="stroke.w" step="0.1" value="${(a.stroke || {}).w || 0}"></div>
        <div class="f"><span>그라디언트</span><label><input type="checkbox" data-a="grad" ${a.gradient ? "checked" : ""}> 쓰기</label></div>
        ${a.gradient ? `<div class="m3"><label>시작${colorSel("grad.c0", a.gradient.stops[0].c)}</label><label>끝${colorSel("grad.c1", a.gradient.stops[a.gradient.stops.length - 1].c)}</label><label>${a.gradient.type === "radial" ? "원형" : "각도 °"}<input type="number" data-a="grad.angle" step="15" value="${a.gradient.angle || 0}"></label></div><div class="f"><span>모양</span><select data-a="grad.type"><option value="linear" ${a.gradient.type !== "radial" ? "selected" : ""}>선형</option><option value="radial" ${a.gradient.type === "radial" ? "selected" : ""}>원형</option></select></div>` : ""}
        ${a.t === "rect" ? `<div class="f"><span>모서리 따로</span><input type="text" data-a="radius4" value="${Array.isArray(a.radius) ? a.radius.join(", ") : ""}" placeholder="왼위, 오위, 오아래, 왼아래 (mm)"></div>` : ""}`;
      else if (a.t === "image") h += `<div class="m3"><label>폭<input type="number" data-a="w" step="0.5" value="${a.w}"></label><label>높이<input type="number" data-a="h" step="0.5" value="${a.h}"></label></div><div class="f"><span>그림 키</span><input type="text" data-a="src" value="${esc(a.src || "")}"></div>
        <div class="f"><span>맞춤</span><select data-a="fit"><option value="contain" ${a.fit !== "cover" ? "selected" : ""}>틀 안에 다 보이게</option><option value="cover" ${a.fit === "cover" ? "selected" : ""}>틀 채우고 자르기</option></select></div>
        <div class="m4"><label>그림 x<input type="number" data-a="img.x" step="0.5" value="${a.img ? a.img.x : ""}" placeholder="틀"></label><label>y<input type="number" data-a="img.y" step="0.5" value="${a.img ? a.img.y : ""}"></label><label>폭<input type="number" data-a="img.w" step="0.5" value="${a.img ? a.img.w : ""}"></label><label>높이<input type="number" data-a="img.h" step="0.5" value="${a.img ? a.img.h : ""}"></label></div>
`;
      h += `<div class="m3"><label>회전 °<input type="number" data-a="rotate" step="1" value="${a.rotate || 0}"></label><label>불투명 %<input type="number" data-a="opacity" min="0" max="100" step="5" value="${Math.round((a.opacity == null ? 1 : a.opacity) * 100)}"></label></div>`;
    }
    h += `<h3>자리</h3><div class="m3"><label>x<input data-it="x" type="number" step="0.5" value="${it.x}"></label><label>y<input data-it="y" type="number" step="0.5" value="${it.y}"></label><label>폭<input data-it="w" type="number" step="0.5" value="${it.w || ""}" placeholder="그대로"></label></div>
      <div class="row"><button class="btn sm sub" id="s-dup">⧉ 복제</button><button class="btn sm sub" id="s-lock">${it.lock ? "🔓 잠금 해제" : "🔒 잠금"}</button><button class="btn sm danger" id="s-x">지우기</button></div>
      ${layersHtml()}`;
  } else {
    $("#stitle").textContent = `페이지 ${idx() + 1} / ${docPages().length}`;
    h += `<div class="f"><span>판형</span><select id="s-spec">${LIB.specs.map(s => `<option value="${s.id}" ${s.id === (page.spec || "a4") ? "selected" : ""}>${s.id} ${s.w}×${s.h}</option>`).join("")}</select></div>
      <div class="f"><span>좌우 반전</span><input id="s-mirror" type="checkbox" ${page.mirror ? "checked" : ""} title="책에서 오른쪽 면은 머리말·쪽번호가 뒤집힌다" style="width:auto"></div>
      <div class="f"><span>이름</span><input type="text" id="s-pname" value="${esc(page.name || "")}"></div>
      <div class="f"><span>책에서</span><span title="원고 자리가 있으면 지문마다 반복, 없으면 한 번">${page.items.some(it => it.block && (byId("blocks")[it.block] || {}).source === "content") ? "지문마다 반복" : "한 번"}</span></div>
      ${layersHtml()}`;
  }
  box.innerHTML = h;
  const on = (q, ev, fn) => { const el = box.querySelector(q); if (el) el.addEventListener(ev, fn); };
  box.querySelectorAll("[data-it]").forEach(i => i.onchange = () => { hist(); const it = page.items[sel]; const k = i.dataset.it; if (k === "w" && !i.value) delete it.w; else it[k] = +i.value; save(); render(); });
  box.querySelectorAll("[data-a]").forEach(i => i.addEventListener(i.tagName === "TEXTAREA" || i.type === "text" ? "change" : "change", () => {
    hist(); const a = page.items[sel].atom; const k = i.dataset.a; let v = i.type === "checkbox" ? i.checked : (i.type === "number" ? +i.value : i.value);
    if (k === "dash") { a.stroke = a.stroke || {w: 0.5, color: "$rule"}; if (v) a.stroke.dash = [1, 1]; else delete a.stroke.dash; }
    else if (k.startsWith("stroke.")) { const kk = k.slice(7); if (kk === "color" && !v) delete a.stroke; else { a.stroke = a.stroke || {w: 0.5, color: "$ink"}; if (kk === "cap" && v === "butt") delete a.stroke.cap; else a.stroke[kk] = v; } }
    else if (k === "fill" && !v) delete a.fill;
    else if (k === "bind" && !v) delete a.bind;
    else if (k === "rotate") { if (v) a.rotate = v; else delete a.rotate; }
    else if (k === "opacity") { const o = Math.max(0, Math.min(100, v)) / 100; if (o < 1) a.opacity = o; else delete a.opacity; }
    else if (k === "fit") { if (v === "cover") a.fit = "cover"; else delete a.fit; }
    else if (k === "d") { if (v) a.d = v; }
    else if (k === "grad") { if (v) a.gradient = {type: "linear", angle: 90, stops: [{c: a.fill || "$s1"}, {c: "$white"}]}; else delete a.gradient; }
    else if (k.startsWith("grad.")) { const g = a.gradient; if (!g) return; const kk = k.slice(5); if (kk === "c0") g.stops[0].c = v || "$ink"; else if (kk === "c1") g.stops[g.stops.length - 1].c = v || "$white"; else if (kk === "angle") g.angle = v; else if (kk === "type") { g.type = v; if (v === "radial") delete g.angle; } }
    else if (k === "radius4") { const r = String(v).split(/[,\s]+/).filter(Boolean).map(Number); if (r.length === 4 && r.every(x => x >= 0)) a.radius = r.every(x => x === r[0]) ? r[0] : r; else if (!v) { if (Array.isArray(a.radius)) delete a.radius; } }
    else if (k.startsWith("img.")) { const kk = k.slice(4); if (i.value === "") { delete a.img; } else { a.img = a.img || {x: 0, y: 0, w: a.w, h: a.h}; a.img[kk] = v; } }
    else if (["tracking", "indent", "indent_first", "indent_right", "space_before", "space_after", "inset", "gutter", "leading"].includes(k)) { if (v) a[k] = v; else delete a[k]; }
    else if (k === "columns") { if (v > 1) a.columns = Math.round(v); else delete a.columns; }
    else if (k === "valign") { if (v === "top") delete a.valign; else a.valign = v; }
    else a[k] = v;
    save(); render(); side();
  }));
  on("#var", "change", async (e) => { sk.variants = sk.variants || {}; sk.variants[page.items[sel].block] = e.target.value; await api("/api/units/skins", sk); pageSvg = {}; render(); thumbsLoad(); drawRail(); side(); });
  on("#s-edit", "click", () => enterEdit(sel)); on("#s-toblock", "click", () => partToBlock(sel)); on("#s-toblock2", "click", saveAsElement); on("#s-down", "click", ungroup); on("#s-group", "click", () => groupToPart());
  on("#s-dup", "click", dupSel); on("#s-x", "click", removeSel); on("#s-lock", "click", lockSel); wireLayers(box);
  wireLayers(box);
  on("#s-spec", "change", (e) => { page.spec = e.target.value; save(); layout(); render(); });
  on("#s-pname", "input", (e) => { $("#pname").value = e.target.value; $("#pname").oninput(); });
  on("#s-mirror", "change", (e) => { page.mirror = e.target.checked; save(); });
}
$("#pname").oninput = () => { if (page) { page.name = $("#pname").value; save(); const el = document.querySelector(`.pg[data-id="${page.id}"]`); if (el) el.title = page.name || page.id; } };

// ── 저장 ──
let st = null, skt = null;
function save() {
  if (!page) return; $("#st").textContent = "저장 중…";
  clearTimeout(st); st = setTimeout(async () => { const j = await api("/api/units/pages", page); $("#st").textContent = j.error ? "저장 실패: " + j.error : "저장됨"; }, 500);
}
function saveSkin() { clearTimeout(skt); skt = setTimeout(async () => { await api("/api/units/skins", skin()); thumbsLoad(); pageSvg = {}; drawRail(); }, 800); }
async function thumbsLoad() { thumbs = await api("/api/units/thumbs?skin=" + encodeURIComponent($("#skin").value || "")); panel(); }
$("#skin").onchange = () => { pageSvg = {}; thumbsLoad(); drawRail(); render(); side(); };

// ── 시작 ──
$("#skin").innerHTML = LIB.skins.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
thumbsLoad();
(() => {
  const q = new URLSearchParams(location.search); const pl = byId("plans")[q.get("plan") || ""];
  if (pl) openPlan(pl); else showStart();
})();
</script>
