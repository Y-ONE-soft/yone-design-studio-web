{% extends "base.html" %}
{% block title %}단위 캔버스{% endblock %}
{% block theme %}light{% endblock %}
{% block content %}
<style>
  .cv { display: flex; height: 100vh; background: #ecebf3; color: #1f2330; font-size: 13px; user-select: none; }
  .cv h3 { font-size: 11.5px; color: var(--mute); margin: 14px 0 6px; font-weight: 600; letter-spacing: .04em; }
  .cv input[type=text], .cv input[type=number], .cv select, .cv textarea { box-sizing: border-box; background: #fff; color: var(--ink); border: 1px solid #cfc8e6; border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; background: var(--pp); color: #fff; border: 0; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .btn:hover { background: #6a1fd0; }
  .btn.sub { background: #f1f0f6; color: #1f2330; font-weight: 500; }
  .btn.sub:hover { background: #e2e0ec; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }
  .btn.danger { background: #fff; color: #c0263a; border: 1px solid #f0c4cb; }
  .btn:disabled { opacity: .45; cursor: default; }
  .note { color: var(--mute); font-size: 11.5px; line-height: 1.5; margin: 4px 0; }
  .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #eee; color: #555; vertical-align: middle; }
  .tag.b { background: #e9e0ff; color: #5b21b6; } .tag.p { background: #ffe9d6; color: #9a4b00; } .tag.a { background: #dcf3ea; color: #0f6b47; }

  /* 왼쪽 — 단위 탭 (원자·부품·블록·옷·세트·틀) */
  .left { display: flex; flex: none; background: #fff; border-right: 1px solid var(--line); }
  .utabs { width: 68px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: 6px; background: #fbfafd; }
  .utabs button { border: 0; background: transparent; padding: 10px 0 8px; cursor: pointer; font-size: 11px; color: #3c4043; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .utabs button .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; }
  .utabs button:hover .ic { background: #f1f0f6; }
  .utabs button.on { color: var(--pp); font-weight: 600; }
  .utabs button.on .ic { background: var(--pp-bg); }
  .utabs .lv { font-size: 9px; color: #a0a4b5; }
  .upanel { width: 262px; display: flex; flex-direction: column; }
  .upanel .hd { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
  .upanel .hd b { font-size: 13.5px; }
  .upanel .hd .note { margin: 2px 0 0; }
  .upanel .body { flex: 1; overflow: auto; padding: 4px 12px 16px; }
  .ai .box { display: flex; gap: 6px; margin-top: 8px; }
  .ai input { flex: 1; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 5px; background: #fff; cursor: pointer; }
  .card:hover { border-color: var(--pp); box-shadow: 0 2px 8px rgba(125,42,232,.15); }
  .card.on { border-color: var(--pp); background: var(--pp-bg); }
  .card .th { background: #f7f6fb; border-radius: 6px; overflow: hidden; height: 54px; display: flex; align-items: center; }
  .card .th svg { width: 100%; height: auto; display: block; }
  .card .nm { font-size: 11.5px; font-weight: 600; margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .ds { font-size: 10.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .atoms5 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .atoms5 button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 6px; cursor: pointer; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .atoms5 button:hover { border-color: var(--pp); }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); vertical-align: middle; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; }
  .colors label { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--mute); width: 44px; }
  .colors input[type=color] { width: 36px; height: 30px; border: 1px solid var(--line); border-radius: 8px; padding: 1px; background: #fff; cursor: pointer; }
  .li { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; margin: 5px 0; background: #fff; cursor: pointer; font-size: 12px; }
  .li:hover { border-color: var(--pp); } .li.on { border-color: var(--pp); background: var(--pp-bg); }
  .li .ds { color: var(--mute); font-size: 11px; margin-top: 2px; }
  .chip { display: inline-block; font-size: 10.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin: 2px 2px 0 0; cursor: pointer; background: #fff; }
  .chip:hover { border-color: var(--pp); color: var(--pp); }
  .upanel .ft { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11.5px; }

  /* 가운데 */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .stage .area { flex: 1; overflow: auto; padding: 64px 28px 28px; }
  .ptool { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; align-items: center; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(30,20,60,.16); padding: 5px 6px; z-index: 15; }
  .ptool input[type=text] { border: 0; width: 170px; font-weight: 600; padding: 4px 8px; }
  .ptool button { border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; color: #1f2330; white-space: nowrap; }
  .ptool button:hover { background: #f1eff8; }
  .ptool .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .ptool .st { font-size: 11px; color: var(--mute); padding: 0 8px; white-space: nowrap; }
  .paper { position: relative; margin: 0 auto; background: #fff; box-shadow: 0 3px 18px rgba(30,20,60,.18); }
  .paper .svgwrap svg { display: block; width: 100%; height: auto; }
  .paper .svgwrap svg g[data-fi] { cursor: move; }
  .paper .svgwrap svg g[data-fi]:hover { outline: 1.5px dashed #b39cf5; }
  .paper .svgwrap svg g.sel2 { outline: 2px dashed var(--pp); }
  .selbox { position: absolute; border: 2px solid var(--pp); border-radius: 2px; pointer-events: none; display: none; }
  .selbox .lb { position: absolute; left: -2px; top: -18px; font-size: 10px; background: var(--pp); color: #fff; padding: 1px 6px; border-radius: 4px 4px 0 0; white-space: nowrap; }
  .selbox .rs { position: absolute; right: -6px; top: 50%; margin-top: -8px; width: 10px; height: 16px; background: #fff; border: 2px solid var(--pp); border-radius: 4px; cursor: ew-resize; pointer-events: auto; }
  .tools { position: absolute; display: none; gap: 3px; background: #1f2330; border-radius: 8px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 20; }
  .tools button { border: 0; background: transparent; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .tools button:hover { background: #3a3f52; }
  .tools button.x:hover { background: #c0263a; }
  .warn { background: #fff7e6; border: 1px solid #f0d9a8; color: #6b4d00; border-radius: 8px; padding: 6px 10px; font-size: 12px; margin: 0 auto 12px; max-width: 760px; white-space: pre-wrap; }
  .empty { color: var(--mute); text-align: center; padding: 80px 20px; font-size: 14px; line-height: 1.7; }

  .strip { flex: none; background: #f4f3f9; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  .strip .rail { display: flex; gap: 10px; align-items: flex-end; padding: 12px 16px 6px; overflow-x: auto; }
  .pg { flex: none; width: 84px; position: relative; cursor: pointer; }
  .pg .th { background: #fff; border: 2.5px solid #e2e0ec; border-radius: 6px; aspect-ratio: 210 / 297; overflow: hidden; display: flex; align-items: flex-start; }
  .pg .th svg { width: 100%; height: auto; display: block; }
  .pg:hover .th { border-color: #b39cf5; }
  .pg.on .th { border-color: var(--pp); box-shadow: 0 0 0 2px rgba(125,42,232,.18); }
  .pg .no { position: absolute; left: 5px; bottom: 4px; font-size: 10.5px; color: #3c4043; background: rgba(255,255,255,.85); padding: 0 4px; border-radius: 4px; }
  .pg.dragover .th { border-color: var(--pp); border-left-width: 6px; }
  .addpg { flex: none; width: 84px; aspect-ratio: 210 / 297; border: 2px dashed #cfc8e6; border-radius: 6px; background: #fff; display: grid; place-items: center; font-size: 26px; color: var(--pp); cursor: pointer; position: relative; }
  .addpg:hover { border-color: var(--pp); background: var(--pp-bg); }
  .menu { position: absolute; left: 0; bottom: calc(100% + 6px); width: 190px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(30,20,60,.18); padding: 6px; z-index: 30; display: none; text-align: left; }
  .menu.on { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: #1f2330; }
  .menu button:hover { background: #f1eff8; }
  .menu button small { display: block; color: var(--mute); font-size: 10.5px; }
  .strip .foot { display: flex; align-items: center; gap: 12px; padding: 2px 16px 8px; font-size: 12px; color: var(--mute); }
  .strip .foot .cnt { margin-left: auto; font-weight: 600; color: #1f2330; }
  .strip .foot input[type=range] { width: 140px; }

  /* 오른쪽 — 고른 것의 단위 사슬 */
  .side { width: 262px; flex: none; background: #fff; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .side .hd { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .side .body { flex: 1; overflow: auto; padding: 4px 14px 16px; }
  .chain { border-left: 2px solid #e2e0ec; margin: 8px 0 8px 6px; padding-left: 10px; }
  .chain div { position: relative; font-size: 12px; margin: 5px 0; }
  .chain div::before { content: ""; position: absolute; left: -15px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: #cfc8e6; }
  .chain div.cur::before { background: var(--pp); }
  .chain a { color: var(--pp); }
  .f { display: grid; grid-template-columns: 62px 1fr; gap: 6px; align-items: center; margin: 6px 0; font-size: 12px; color: var(--mute); }
  .f input, .f select { width: 100%; }
  .m3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .m3 label { font-size: 10.5px; color: var(--mute); }
  .m3 input { width: 100%; padding: 4px 5px; }
</style>

<div class="cv">
  <!-- 왼쪽: 단위 탭 -->
  <div class="left">
    <div class="utabs">
      <button data-tab="blocks" class="on"><span class="ic">🧩</span>블록<span class="lv">③ 콘텐츠 자리</span></button>
      <button data-tab="parts"><span class="ic">🔩</span>부품<span class="lv">② 원자 묶음</span></button>
      <button data-tab="atoms"><span class="ic">⚛</span>원자<span class="lv">① 오브젝트</span></button>
      <button data-tab="skins"><span class="ic">👕</span>옷<span class="lv">색·서체·모양</span></button>
      <button data-tab="sets"><span class="ic">📄</span>세트<span class="lv">콘텐츠</span></button>
      <button data-tab="plans"><span class="ic">📚</span>틀<span class="lv">책 구성</span></button>
    </div>
    <div class="upanel">
      <div class="hd" id="phd"></div>
      <div class="body" id="pbody"></div>
      <div class="ft"><a href="/units/library">라이브러리 · PDF/그림에서 뽑기 · JSON →</a></div>
    </div>
  </div>

  <!-- 가운데 -->
  <div class="stage">
    <div class="ptool">
      <input type="text" id="pname" placeholder="지면 이름">
      <span class="sep"></span>
      <label class="note">옷</label><select id="skin"></select>
      <span class="sep"></span>
      <button id="p-dup" title="지면 복제">⧉ 복제</button>
      <button id="p-del" title="지면 지우기">🗑</button>
      <span class="st" id="st"></span>
    </div>
    <div class="area" id="area">
      <div id="warn" class="warn" style="display:none"></div>
      <div class="paper" id="paper"><div class="svgwrap" id="svgwrap"></div><div class="selbox" id="selbox"><span class="lb" id="sellb"></span><span class="rs" id="rs" title="폭 바꾸기"></span></div>
        <div class="tools" id="tools"><button id="t-group" title="고른 원자들을 부품으로">🔩 부품으로 묶기</button><button id="t-dup" title="복제">⧉</button><button id="t-x" class="x" title="지우기">✕</button></div>
      </div>
    </div>
    <div class="strip">
      <div class="rail" id="rail"></div>
      <div class="foot">
        <span>④ 지면 — ←/→ 이동 · 썸네일 끌어 순서 · Shift+클릭으로 여러 원자 고르기</span>
        <span class="cnt" id="cnt"></span>
        <label>확대 <input type="range" id="zoom" min="30" max="200" value="100"></label><span id="zoomv">맞춤</span>
      </div>
    </div>
  </div>

  <!-- 오른쪽 -->
  <div class="side">
    <div class="hd" id="stitle">지면</div>
    <div class="body" id="side"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const LIB = {{ library_json | safe }};
const $ = (s) => document.querySelector(s);
const api = async (url, body, method) => {
  const r = await fetch(url, {method: method || (body ? "POST" : "GET"), headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({error: r.status + " " + r.statusText}));
  if (!r.ok && !j.error) j.error = r.status + " " + r.statusText;
  return j;
};
const byId = (k) => Object.fromEntries((LIB[k] || []).map(x => [x.id, x]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const snap = (v) => Math.round(v * 2) / 2;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const M = {left: 20, right: 20, top: 44, bottom: 20};
const GROUPS = [["지문", ["B1", "B2", "B3", "B7"]], ["문항", ["B6"]], ["드릴", ["B5", "B8"]], ["머리 · 꼬리 · 간지 · 표지", ["B10", "B11"]]];
const ATOMS = [
  ["text", "글상자", {t: "text", x: 0, y: 0, w: 80, h: 6, font: "$body", size: 9, color: "$ink", text: "글상자 — 오른쪽에서 글·크기·색을"}],
  ["line", "선", {t: "line", x1: 0, y1: 0, x2: 80, y2: 0, stroke: {w: 0.5, color: "$rule"}}],
  ["rect", "면", {t: "rect", x: 0, y: 0, w: 60, h: 20, fill: "$cream", radius: 1}],
  ["ellipse", "원", {t: "ellipse", x: 0, y: 0, w: 10, h: 10, stroke: {w: 0.5, color: "$sel"}}],
  ["image", "그림", {t: "image", x: 0, y: 0, w: 40, h: 30, src: "img1"}],
];
const ATOM_NM = Object.fromEntries(ATOMS.map(a => [a[0], a[1]]));

let page = null, sel = null, sels = new Set(), scale = 3, zoom = 1, thumbs = {blocks: {}, parts: {}}, pageSvg = {}, curSet = "";
let tab = new URLSearchParams(location.search).get("tab") || "blocks";      // ?tab=atoms 로 바로 열기
const specOf = (p) => byId("specs")[(p || page || {}).spec] || byId("specs").a4 || {w: 210, h: 297};
const skin = () => byId("skins")[$("#skin").value] || LIB.skins[0];
const idx = () => LIB.pages.findIndex(x => page && x.id === page.id);
const unitOf = (it) => it.atom ? "atom" : (it.block ? "block" : "part");
const nameOf = (it) => it.atom ? ("원자 · " + ATOM_NM[it.atom.t]) : it.block ? (byId("blocks")[it.block] || {name: it.block}).name : (byId("parts")[it.part] || {name: it.part}).name;
const partOfBlock = (bid) => { const b = byId("blocks")[bid]; if (!b) return null; const v = (b.variants || []).find(v => v.id === (skin().variants || {})[bid]) || b.variants[0]; return v && byId("parts")[v.part]; };

// ── 지면 만들기 · 순서 ──
function newPage(kind) {
  let n = 1; while (byId("pages")["page_" + n]) n++;
  const S = specOf(); const p = {id: "page_" + n, name: "", spec: (page && page.spec) || "a4", mirror: true, zones: [], items: []};
  if (kind === "dup" && page) { const d = clone(page); d.id = "page_" + n; d.name = (page.name || page.id) + " 복사"; return d; }
  p.name = {body: "본문", blank: "빈 면", divider: "간지", cover: "표지"}[kind] + " " + n;
  if (kind === "body") { if (byId("blocks").running_head) p.items.push({block: "running_head", x: M.left, y: 14}); if (byId("blocks").folio) p.items.push({block: "folio", x: M.left, y: S.h - 19}); }
  if (kind === "divider" || kind === "cover") { p.mirror = false; if (byId("blocks")[kind]) p.items.push({block: kind, x: 0, y: 0}); }
  return p;
}
async function addPage(kind) {
  const p = newPage(kind); if (!p) return;
  const j = await api("/api/units/pages?after=" + encodeURIComponent(page ? page.id : ""), p); if (j.error) { $("#st").textContent = j.error; return; }
  LIB.pages.splice(page ? idx() + 1 : 0, 0, p); open(p);
}
async function movePageTo(fromId, toIndex) {
  const i = LIB.pages.findIndex(x => x.id === fromId); if (i < 0) return;
  const [p] = LIB.pages.splice(i, 1); const j = Math.max(0, Math.min(toIndex, LIB.pages.length)); LIB.pages.splice(j, 0, p);
  await api("/api/units/pages?after=" + encodeURIComponent(j > 0 ? LIB.pages[j - 1].id : ""), p); drawRail(); side();
}
$("#p-dup").onclick = () => addPage("dup");
$("#p-del").onclick = async () => {
  if (!page || !confirm(`지면 「${page.name || page.id}」 을 지울까?`)) return;
  const i = idx(); await api("/api/units/pages", {id: page.id}, "DELETE"); LIB.pages.splice(i, 1); delete pageSvg[page.id];
  if (LIB.pages.length) open(LIB.pages[Math.min(i, LIB.pages.length - 1)]); else { page = null; $("#svgwrap").innerHTML = ""; drawRail(); $("#side").innerHTML = ""; }
};

// ── 열기 · 그리기 ──
function open(p) {
  page = byId("pages")[p.id] || p; sel = null; sels.clear();
  if (!page.items) page.items = [];
  if (page.chrome && page.chrome.length) { page.items = page.chrome.map(c => ({part: c.part, x: c.x, y: c.y})).concat(page.items); delete page.chrome; }
  $("#pname").value = page.name || ""; location.hash = page.id;
  drawRail(); layout(); render(); side();
  const el = document.querySelector(`.pg[data-id="${page.id}"]`); if (el) el.scrollIntoView({inline: "nearest", block: "nearest"});
}
function layout() {
  const sp = specOf(); const fit = Math.min(3.4, ($("#area").clientWidth - 60) / sp.w, ($("#area").clientHeight - 90) / sp.h);
  scale = fit * zoom;
  const paper = $("#paper"); paper.style.width = (sp.w * scale) + "px"; paper.style.height = (sp.h * scale) + "px";
}
window.addEventListener("resize", () => { if (page) { layout(); selbox(); } });
$("#zoom").oninput = () => { zoom = $("#zoom").value / 100; $("#zoomv").textContent = zoom === 1 ? "맞춤" : Math.round(zoom * 100) + "%"; layout(); selbox(); };
let rt = null;
function render() {
  if (!page) return;
  clearTimeout(rt);
  rt = setTimeout(async () => {
    const j = await api("/api/units/preview", {kind: "pages", item: page, skin: $("#skin").value, mode: "canvas", spec: page.spec, set: curSet});
    const w = $("#warn");
    if (j.error) { w.style.display = ""; w.textContent = j.error; return; }
    const svg = (j.svgs[0] || {}).svg || "";
    $("#svgwrap").innerHTML = svg; strip($("#svgwrap"));
    pageSvg[page.id] = svg; const th = document.querySelector(`.pg[data-id="${page.id}"] .th`); if (th) { th.innerHTML = svg; strip(th); }
    w.style.display = (j.warnings || []).length ? "" : "none"; w.textContent = (j.warnings || []).join("\n");
    wire(); selbox();
  }, 40);
}
function strip(box) { const s = box.querySelector("svg"); if (s) { s.removeAttribute("width"); s.removeAttribute("height"); } }

// ── 아래 지면 띠 ──
let dragId = null;
async function drawRail() {
  const rail = $("#rail"); rail.innerHTML = "";
  LIB.pages.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "pg" + (page && p.id === page.id ? " on" : ""); d.dataset.id = p.id; d.draggable = true; d.title = p.name || p.id;
    d.innerHTML = `<div class="th">${pageSvg[p.id] || ""}</div><span class="no">${i + 1}</span>`; strip(d);
    d.onclick = () => open(p);
    d.ondragstart = (e) => { dragId = p.id; e.dataTransfer.effectAllowed = "move"; };

async function groupToPart() {
  const ids = [...new Set([...sels, sel])].filter(i => page.items[i] && page.items[i].atom).sort((a, b) => a - b); if (!ids.length) return;
  const name = prompt("부품 이름", "새 부품"); if (name == null) return;
  let n = 1; while (byId("parts")["p_" + n]) n++; const pid = "p_" + n;
  const its = ids.map(i => page.items[i]);
  const bb = (it) => { const a = it.atom; const w = a.t === "line" ? Math.abs(a.x2 - a.x1) : a.w, h = a.t === "line" ? Math.abs(a.y2 - a.y1) : a.h; const sx = it.w && w ? it.w / w : 1; return {x: it.x, y: it.y, w: w * sx, h, sx}; };

}

  } else if (tab === "plans") {
    hd.innerHTML = `<b>📚 틀</b> <span class="tag">책 구성</span><div class="note">구간(STEP·회차) 순서 + 어느 지면을 세트마다 반복할지. 라인업 이름이 붙는 곳.</div>`;
    for (const p of LIB.plans) { const d = document.createElement("div"); d.className = "li"; d.style.cursor = "default";
      d.innerHTML = `<b>${esc(p.name)}</b> <code style="font-size:10px;color:#7a6aa8">${p.id}</code><div class="ds">규격 ${p.spec} · 앞 ${(p.front || []).length} · 구간 ${(p.sections || []).length}</div>
        ${(p.sections || []).map(s => `<div class="ds" style="margin-top:4px">▸ ${esc(s.name)}${s.divider ? ` <span class="chip" data-pg="${s.divider}">간지 ${s.divider}</span>` : ""} ${(s.pages || []).map(pg => `<span class="chip" data-pg="${pg.page}">${pg.page} · ${pg.repeat === "each_set" ? "세트마다" : "한 번"}</span>`).join("")}</div>`).join("")}
        <div class="row" style="margin:6px 0 0"><a class="btn sm sub" href="/units/library#plans/${p.id}">책으로 미리보기 →</a></div>`;
      d.querySelectorAll("[data-pg]").forEach(c => c.onclick = () => { const pg = byId("pages")[c.dataset.pg]; if (pg) open(pg); }); body.appendChild(d); }
    body.insertAdjacentHTML("beforeend", `<div class="row" style="margin-top:12px"><button class="btn sm" id="pl-new">지금 지면 순서를 틀로 저장</button></div><div class="note">아래 띠의 지면을 그 순서대로 한 구간에 넣는다. 세트마다 반복할 지면은 라이브러리에서 <code>each_set</code> 으로.</div>`);
    $("#pl-new").onclick = async () => { const name = prompt("틀 이름", "새 틀"); if (name == null) return; let n = 1; while (byId("plans")["plan_" + n]) n++;
      const pl = {id: "plan_" + n, name, spec: (page && page.spec) || "a4", front: [], sections: [{id: "s1", name: "본문", pages: LIB.pages.map(p => ({page: p.id, repeat: "once"}))}], back: []};
      const j = await api("/api/units/plans", pl); if (j.error) { $("#st").textContent = j.error; return; } LIB.plans.push(pl); panel(); };
  }
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; panel(); });
async function makeByPrompt() {
  const inp = $("#ai"); const prompt = inp.value.trim(); if (!prompt || !page) return;
  $("#btn-ai").disabled = true; $("#ainote").textContent = "그리는 중… (15초쯤)";
  const j = await api("/api/units/make", {prompt, skin: $("#skin").value});
  if (j.error) { $("#btn-ai").disabled = false; $("#ainote").textContent = j.error; return; }
  const lj = await api("/api/units/library"); LIB.blocks = lj.blocks; LIB.parts = lj.parts; LIB.skins = lj.skins;
  await thumbsLoad(); addBlock(j.block.id); $("#ainote").textContent = `「${j.block.name}」 을 넣었다.` + (j.note ? " " + j.note : ""); $("#btn-ai").disabled = false;
}

// ── 오른쪽: 고른 것의 단위 사슬 ──
function side() {
  const box = $("#side"); if (!page) { box.innerHTML = ""; return; }
  let h = ""; const sk = skin();
  const colorSel = (k, cur, none) => `<select data-a="${k}">${none ? `<option value="">없음</option>` : ""}${Object.entries(sk.tokens.color || {}).map(([n, v]) => `<option value="$${n}" ${cur === "$" + n ? "selected" : ""}>${n} ${v}</option>`).join("")}</select>`;
  if (sel != null && page.items[sel]) {
    const it = page.items[sel]; const u = unitOf(it);
    $("#stitle").textContent = nameOf(it);
    if (u === "block") {
      const blk = byId("blocks")[it.block] || {variants: []}; const part = partOfBlock(it.block); const cur = (sk.variants || {})[it.block] || (blk.variants[0] || {}).id;
      h += `<div class="chain"><div class="cur"><span class="tag b">③ 블록</span> ${esc(blk.name)} — 필드 ${Object.keys(blk.fields || {}).join(", ") || "없음"}</div>
        <div><span class="tag">모양</span> <select id="var" style="width:auto">${(blk.variants || []).map(v => `<option value="${v.id}" ${v.id === cur ? "selected" : ""}>${esc(v.name || v.id)}</option>`).join("")}</select> <small class="note" style="display:inline">옷 ${esc(sk.name)} 에 저장</small></div>
        <div><span class="tag p">② 부품</span> ${part ? esc(part.name) : "?"} <a href="/units/library#parts/${part ? part.id : ""}">고치기 →</a></div>
        <div><span class="tag a">① 원자</span> ${part ? part.atoms.length : 0}개 ${part ? "(" + Object.entries(part.atoms.reduce((m, a) => (m[ATOM_NM[a.t]] = (m[ATOM_NM[a.t]] || 0) + 1, m), {})).map(([k, v]) => k + " " + v).join(" · ") + ")" : ""}</div></div>`;
    } else if (u === "part") {
      const part = byId("parts")[it.part] || {atoms: []};
      h += `<div class="chain"><div><span class="tag b">③ 블록</span> 아직 아님 — <button class="btn sm" id="s-toblock">블록으로 만들기</button><div class="note">글상자의 콘텐츠 이름(bind)이 필드가 된다</div></div>
        <div class="cur"><span class="tag p">② 부품</span> ${esc(part.name)} <a href="/units/library#parts/${it.part}">고치기 →</a></div>
        <div><span class="tag a">① 원자</span> ${part.atoms.length}개</div></div>`;
    } else {
      const a = it.atom;
      h += `<div class="chain"><div><span class="tag p">② 부품</span> Shift+클릭으로 원자를 고른 뒤 「부품으로 묶기」</div><div class="cur"><span class="tag a">① 원자</span> ${ATOM_NM[a.t]}</div></div>`;
      if (a.t === "text") h += `<div class="f"><span>글</span><textarea data-a="text" rows="3">${esc(a.text || "")}</textarea></div>
        <div class="f"><span>콘텐츠 이름</span><input type="text" data-a="bind" value="${esc(a.bind || "")}" placeholder="예: sentence · no · prompt"></div>
        <div class="f"><span>서체</span><select data-a="font">${Object.entries(sk.tokens.font || {}).map(([n, v]) => `<option value="$${n}" ${a.font === "$" + n ? "selected" : ""}>${n} — ${esc(v)}</option>`).join("")}</select></div>
        <div class="f"><span>크기 pt</span><input type="number" data-a="size" step="0.5" value="${a.size}"></div>
        <div class="f"><span>색</span>${colorSel("color", a.color)}</div>
        <div class="f"><span>정렬</span><select data-a="align">${["left", "center", "right", "justify"].map(v => `<option ${a.align === v ? "selected" : ""}>${v}</option>`).join("")}</select></div>
        <div class="f"><span>높이 mm</span><input type="number" data-a="h" step="0.5" value="${a.h}"></div>`;
      else if (a.t === "line") h += `<div class="f"><span>길이 mm</span><input type="number" data-a="x2" step="0.5" value="${a.x2}"></div><div class="f"><span>굵기 pt</span><input type="number" data-a="stroke.w" step="0.1" value="${(a.stroke || {}).w || 0.5}"></div>
        <div class="f"><span>색</span>${colorSel("stroke.color", (a.stroke || {}).color)}</div><div class="f"><span>점선</span><input type="checkbox" data-a="dash" ${(a.stroke || {}).dash ? "checked" : ""}></div>`;
      else if (a.t === "rect" || a.t === "ellipse") h += `<div class="m3"><label>폭<input type="number" data-a="w" step="0.5" value="${a.w}"></label><label>높이<input type="number" data-a="h" step="0.5" value="${a.h}"></label>${a.t === "rect" ? `<label>모서리<input type="number" data-a="radius" step="0.5" value="${a.radius || 0}"></label>` : ""}</div>
        <div class="f"><span>채움</span>${colorSel("fill", a.fill, true)}</div><div class="f"><span>테두리</span>${colorSel("stroke.color", (a.stroke || {}).color, true)}</div><div class="f"><span>굵기 pt</span><input type="number" data-a="stroke.w" step="0.1" value="${(a.stroke || {}).w || 0}"></div>`;
      else if (a.t === "image") h += `<div class="m3"><label>폭<input type="number" data-a="w" step="0.5" value="${a.w}"></label><label>높이<input type="number" data-a="h" step="0.5" value="${a.h}"></label></div><div class="f"><span>그림 키</span><input type="text" data-a="src" value="${esc(a.src || "")}"></div><div class="note">파일은 옷의 images 에 키→경로로 적는다.</div>`;
    }
    h += `<h3>자리</h3><div class="m3"><label>x<input data-it="x" type="number" step="0.5" value="${it.x}"></label><label>y<input data-it="y" type="number" step="0.5" value="${it.y}"></label><label>폭<input data-it="w" type="number" step="0.5" value="${it.w || ""}" placeholder="그대로"></label></div>
      <div class="row"><button class="btn sm sub" id="s-dup">⧉ 복제</button><button class="btn sm danger" id="s-x">지우기</button></div>`;
  } else {
    $("#stitle").textContent = `④ 지면 ${idx() + 1} / ${LIB.pages.length}`;
    h += `<div class="f"><span>판형</span><select id="s-spec">${LIB.specs.map(s => `<option value="${s.id}" ${s.id === (page.spec || "a4") ? "selected" : ""}>${s.id} ${s.w}×${s.h}</option>`).join("")}</select></div>
      <div class="f"><span>좌우 반전</span><label><input id="s-mirror" type="checkbox" ${page.mirror ? "checked" : ""}> 책에서 오른쪽 면은 뒤집힌다</label></div>
      <h3>이 지면의 요소 ${page.items.length}</h3>${page.items.map((it, k) => `<div class="note" data-seli="${k}" style="cursor:pointer;margin:2px 0"><span class="tag ${({atom: "a", part: "p", block: "b"})[unitOf(it)]}">${({atom: "①", part: "②", block: "③"})[unitOf(it)]}</span> ${esc(nameOf(it))} <span style="color:#b0b3c0">${it.x},${it.y}</span></div>`).join("") || `<div class="note">비어 있음 — 왼쪽 탭에서 블록·부품·원자를 누른다</div>`}
      <h3>단위</h3><div class="chain"><div><span class="tag a">①</span> 원자 — 글상자·선·면·원·그림</div><div><span class="tag p">②</span> 부품 — 원자 묶음</div><div><span class="tag b">③</span> 블록 — 부품 + 필드 = 유형</div><div class="cur">④ 지면 — 요소를 놓은 면</div><div>📚 틀 — 지면 순서·반복</div><div>👕 옷 · 📄 세트 — 겉모습 · 콘텐츠</div></div>`;
  }
  box.innerHTML = h;
  const on = (q, ev, fn) => { const el = box.querySelector(q); if (el) el.addEventListener(ev, fn); };
  box.querySelectorAll("[data-it]").forEach(i => i.onchange = () => { const it = page.items[sel]; const k = i.dataset.it; if (k === "w" && !i.value) delete it.w; else it[k] = +i.value; save(); render(); });
  box.querySelectorAll("[data-a]").forEach(i => i.addEventListener(i.tagName === "TEXTAREA" || i.type === "text" ? "change" : "change", () => {
    const a = page.items[sel].atom; const k = i.dataset.a; let v = i.type === "checkbox" ? i.checked : (i.type === "number" ? +i.value : i.value);
    if (k === "dash") { a.stroke = a.stroke || {w: 0.5, color: "$rule"}; if (v) a.stroke.dash = [1, 1]; else delete a.stroke.dash; }
    else if (k.startsWith("stroke.")) { const kk = k.slice(7); if (kk === "color" && !v) delete a.stroke; else { a.stroke = a.stroke || {w: 0.5, color: "$ink"}; a.stroke[kk] = v; } }
    else if (k === "fill" && !v) delete a.fill;
    else if (k === "bind" && !v) delete a.bind;
    else a[k] = v;
    save(); render(); side();
  }));
  on("#var", "change", async (e) => { sk.variants = sk.variants || {}; sk.variants[page.items[sel].block] = e.target.value; await api("/api/units/skins", sk); pageSvg = {}; render(); thumbsLoad(); drawRail(); side(); });
  on("#s-toblock", "click", () => partToBlock(sel));
  on("#s-dup", "click", dupSel); on("#s-x", "click", removeSel);
  box.querySelectorAll("[data-seli]").forEach(d => d.onclick = () => { sel = +d.dataset.seli; sels.clear(); markSels(); selbox(); side(); });
  on("#s-spec", "change", (e) => { page.spec = e.target.value; save(); layout(); render(); });
  on("#s-mirror", "change", (e) => { page.mirror = e.target.checked; save(); });
}
$("#pname").oninput = () => { if (page) { page.name = $("#pname").value; save(); const el = document.querySelector(`.pg[data-id="${page.id}"]`); if (el) el.title = page.name || page.id; } };

// ── 저장 ──
let st = null, skt = null;
function save() {
  if (!page) return; $("#st").textContent = "저장 중…";
  clearTimeout(st); st = setTimeout(async () => { const j = await api("/api/units/pages", page); $("#st").textContent = j.error ? "저장 실패: " + j.error : "저장됨"; }, 500);
}
function saveSkin() { clearTimeout(skt); skt = setTimeout(async () => { await api("/api/units/skins", skin()); thumbsLoad(); pageSvg = {}; drawRail(); }, 800); }
async function thumbsLoad() { thumbs = await api("/api/units/thumbs?skin=" + encodeURIComponent($("#skin").value || "")); panel(); }
$("#skin").onchange = () => { pageSvg = {}; thumbsLoad(); drawRail(); render(); side(); };

// ── 시작 ──
$("#skin").innerHTML = LIB.skins.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
thumbsLoad();
(() => {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const p = byId("pages")[id] || LIB.pages[0];
  if (p) open(p); else { drawRail(); $("#svgwrap").innerHTML = '<div class="empty">지면이 없다.<br>아래 「+」로 시작.</div>'; }
})();
</script>
{% endblock %}
