{% extends "base.html" %}
{% block title %}문서 만들기{% endblock %}
{% block theme %}light{% endblock %}
{% block content %}
<style>{{ font_css|safe }}</style>   {# 서체 굵기 바로잡기 — core/units/fonts.py #}
<style>
  #side input[type=number]::-webkit-inner-spin-button, #side input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }   /* 좁은 칸 가운데 증감 단추가 잘못 눌려 값이 바뀌고 초점이 풀리던 것 */
  #side input[type=number] { -moz-appearance: textfield; }
  .cv { display: flex; height: 100vh; background: #ecebf3; color: #1f2330; font-size: 13px; user-select: none; }
  .cv h3 .gact { position: absolute; right: 0; top: 0; display: none; gap: 1px; }
  .cv h3:hover .gact { display: flex; }
  .cv h3 .gact button { border: 0; background: transparent; color: #a0a4b5; cursor: pointer; font-size: 11px; padding: 1px 4px; border-radius: 5px; }
  .cv h3 .gact button:hover { background: #f1eff8; color: #1f2330; }
  .card .cact { position: absolute; right: 3px; top: 3px; display: none; border: 0; background: rgba(31,35,48,.82); color: #fff; width: 18px; height: 18px; line-height: 16px; border-radius: 5px; font-size: 10px; cursor: pointer; padding: 0; }
  .card:hover .cact { display: block; }
  .card .cact:hover { background: var(--pp); }
  .cv h3.fold { cursor: pointer; user-select: none; }
  .cv h3.fold:hover { color: #1f2330; }
  .cv h3 .tw { display: inline-block; width: 11px; color: #a0a4b5; font-size: 9px; }
  .cv h3 .n { color: #b9bdca; font-weight: 500; }
  .cv h3 { position: relative; font-size: 11.5px; color: var(--mute); margin: 10px 0 5px; font-weight: 600; letter-spacing: .04em; }
  .side .more { margin: 8px 0 2px; }
  .side .more:not([open]) > *:not(summary) { display: none !important; }   /* 우리 .f 가 UA 규칙을 이겨 버린다 */
  .side .more > summary { cursor: pointer; font-size: 11.5px; color: var(--pp); background: var(--pp-bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; list-style: none; }
  .side .more > summary::-webkit-details-marker { display: none; }
  .side .more > summary::before { content: "\25b8  "; }
  .side .more[open] > summary::before { content: "\25be  "; }
  .side h3 { border-top: 1px solid var(--line); padding-top: 9px; margin-top: 13px; color: var(--ink); font-size: 12.5px; }
  .side h3:first-child { border-top: 0; padding-top: 0; margin-top: 2px; }
  .cv input[type=text], .cv input[type=number], .cv select, .cv textarea { box-sizing: border-box; background: #fff; color: var(--ink); border: 1px solid #cfc8e6; border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; background: var(--pp); color: #fff; border: 0; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .btn:hover { background: #6a1fd0; }
  .btn.sub { background: #f1f0f6; color: #1f2330; font-weight: 500; }
  .btn.sub:hover { background: #e2e0ec; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }
  .btn.danger { background: #fff; color: #c0263a; border: 1px solid #f0c4cb; }
  .btn:disabled { opacity: .45; cursor: default; }
  .note { color: var(--mute); font-size: 11.5px; line-height: 1.5; margin: 4px 0; }
  .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #eee; color: #555; vertical-align: middle; }
  .tag.b { background: #e9e0ff; color: #5b21b6; } .tag.p { background: #ffe9d6; color: #9a4b00; } .tag.a { background: #dcf3ea; color: #0f6b47; }

  /* 왼쪽 — 단위 탭 (원자·부품·블록·옷·세트·틀) */
  .left { display: flex; flex: none; background: #fff; border-right: 1px solid var(--line); }
  .upanel { width: 232px; display: flex; flex-direction: column; position: relative; }
  .rsz { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 18; }
  .upanel .rsz { right: -3px; } .side .rsz { left: -3px; }
  .rsz:hover, .rsz.on { background: linear-gradient(90deg, transparent 2px, var(--pp) 2px, var(--pp) 5px, transparent 5px); }
  .upanel .hd { padding: 8px 10px 6px; border-bottom: 1px solid var(--line); }
  .upanel .hd .ttl { display: flex; align-items: center; gap: 6px; }
  .upanel .hd .ttl b { flex: 1; }
  .upanel .hd .fold { border: 0; background: transparent; color: #a0a4b5; cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 6px; }
  .upanel .hd .fold:hover { background: #f1f0f6; color: #1f2330; }
  .upanel .hd b { font-size: 13.5px; }
  .upanel .hd .note { margin: 2px 0 0; }
  .upanel .body { flex: 1; overflow: auto; padding: 4px 12px 16px; }
  .ai .box { display: flex; gap: 6px; margin-top: 8px; }
  .ai input { flex: 1; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .card { position: relative; border: 1px solid var(--line); border-radius: 9px; padding: 4px; background: #fff; cursor: pointer; }
  .card:hover { border-color: var(--pp); box-shadow: 0 2px 8px rgba(125,42,232,.15); }
  .card.on { border-color: var(--pp); background: var(--pp-bg); }
  .card .th { background: #f7f6fb; border-radius: 6px; overflow: hidden; height: 40px; display: flex; align-items: center; }
  .card .th svg { width: 100%; height: auto; display: block; }
  .card .nm { font-size: 11.5px; font-weight: 600; margin: 3px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .ds { font-size: 10.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghost { position: fixed; z-index: 99; width: 120px; opacity: .85; pointer-events: none; box-shadow: 0 8px 24px rgba(30,20,60,.3); }
  .paper.dropok { outline: 3px solid var(--pp); outline-offset: -3px; }
  .atoms5 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .atoms5 button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 2px 4px; cursor: pointer; font-size: 10.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #3c4043; }
  .atoms5 button svg { width: 28px; height: 18px; }
  .atoms5 button:hover { border-color: var(--pp); }
  .atoms5 button.on { border-color: var(--pp); background: var(--pp-bg); color: var(--pp); font-weight: 600; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); vertical-align: middle; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; }
  .colors label { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--mute); width: 44px; }
  .colors input[type=color] { width: 36px; height: 30px; border: 1px solid var(--line); border-radius: 8px; padding: 1px; background: #fff; cursor: pointer; }
  .li { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; margin: 5px 0; background: #fff; cursor: pointer; font-size: 12px; }
  .li:hover { border-color: var(--pp); } .li.on { border-color: var(--pp); background: var(--pp-bg); }
  .li .ds { color: var(--mute); font-size: 11px; margin-top: 2px; }
  .li .x { float: right; color: var(--mute); font-size: 11px; padding: 0 3px; } .li .x:hover { color: #c33; }
  .chip { display: inline-block; font-size: 10.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin: 2px 2px 0 0; cursor: pointer; background: #fff; }
  .chip:hover { border-color: var(--pp); color: var(--pp); }
  .upanel .ft { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11.5px; }
  .howto { margin: 6px 0 2px; }
  .howto > button { width: 100%; text-align: left; }
  .howto ol { margin: 6px 0 0; padding: 0 0 0 18px; font-size: 11.5px; color: var(--mute); line-height: 1.7; }
  .howto ol b { color: #1f2330; }

  /* 가운데 */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .stage .area { flex: 1; overflow: auto; padding: 6px 10px 6px 44px; }
  .stage .area.rul { padding-top: 22px; }        /* 자 자리 */        /* 자를 켜면 가로 자가 위 도구 막대 아래로 내려오게 (안 그러면 안내선을 못 끈다) */
  /* 늘 보이는 도구 상자 (인디자인 도구 패널) — 패널을 접어도 남는다 */
  .trail { position: absolute; left: 6px; top: 48px; z-index: 16; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(30,20,60,.16); padding: 3px; display: flex; flex-direction: column; gap: 1px; }
  .trail button { width: 32px; height: 30px; border: 0; background: transparent; border-radius: 7px; cursor: pointer; color: #3c4043; display: grid; place-items: center; font-size: 0; }
  .trail button span { display: none; }                  /* 이름은 툴팁으로 — 인디자인 도구 패널 */
  .trail button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .trail button:hover { background: #f1eff8; }
  .trail button.on { background: var(--pp); color: #fff; }
  .trail button:disabled { opacity: .3; cursor: default; }
  .trail .sep { height: 1px; background: var(--line); margin: 4px 6px; }
  .thint .shp { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; max-width: 250px; }
  .thint .shp button { border: 1px solid #4b4f61; background: transparent; color: #fff; border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
  .thint .shp button.on { background: var(--pp); border-color: var(--pp); }
  .thint { position: absolute; left: 46px; z-index: 16; background: #1f2330; color: #fff; font-size: 11.5px; padding: 5px 10px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; white-space: nowrap; }

  /* 작업 공간 넓히기 — 패널 접기(왼쪽 아이콘 탭은 남는다) · 쪽 띠 접기 · 넓게(집중) */
  .cv.noleft .left { display: none; }
  .unfold { position: absolute; left: 0; top: 50%; margin-top: -26px; width: 14px; height: 52px; border: 0; border-radius: 0 8px 8px 0; background: #fff; box-shadow: 2px 0 8px rgba(30,20,60,.14); cursor: pointer; color: #7a6aa8; display: none; z-index: 17; font-size: 11px; }
  .cv.noleft .unfold { display: block; }
  .cv.noside .side { display: none; }
  .cv.nostrip .strip .rail { display: none; }
  .cv.nostrip .strip .foot .pgnav { color: var(--pp); font-weight: 600; }
  .cv.nostrip .strip { border-top: 1px solid var(--line); }
  body.zen nav.rail, body.editing-doc nav.rail { display: none; }        /* 문서를 열면 창 전체가 편집기 */
  body.zen main.page, body.editing-doc main.page { margin-left: 0; }
  .utabs .fold { margin-top: auto; margin-bottom: 6px; color: #a0a4b5; }
  .utabs .fold .ic { font-size: 14px; }
  .strip .foot .vw { display: flex; gap: 3px; }
  .strip .foot .vw button { min-width: 28px; }
  .ptool { flex: none; display: flex; gap: 2px; align-items: center; background: #fff; border-bottom: 1px solid var(--line); padding: 2px 8px; z-index: 15; }
  .ptool input[type=text] { border: 0; width: 170px; font-weight: 600; padding: 4px 8px; }
  .ptool button, .ptool a { border: 0; background: transparent; border-radius: 7px; padding: 4px 8px; font-size: 12.5px; cursor: pointer; color: #1f2330; white-space: nowrap; }
  .ptool a.btn { font-weight: 500; }
  .ptool button:hover { background: #f1eff8; }
  .ptool .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .ptool .st { font-size: 11px; color: var(--mute); padding: 0 8px; white-space: nowrap; margin-left: auto; }
  .ptool .ctrl { display: flex; align-items: center; gap: 3px; }
  .ptool .ctrl label { font-size: 10.5px; color: var(--mute); display: flex; align-items: center; gap: 3px; }
  .ptool .ctrl input { width: 52px; padding: 3px 5px; font-size: 11.5px; }
  .ptool .ctrl button { padding: 3px 5px; font-size: 12px; }
  .ptool label { white-space: nowrap; }
  .paper { position: relative; margin: 0 auto; background: #fff; box-shadow: 0 3px 18px rgba(30,20,60,.18); }
  /* 세로로 이어 보기 — 인디자인처럼 굴리면 다음 쪽. 지금 쪽만 고칠 수 있고 나머지는 그림이다 */
  .pages { display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .prow { display: flex; gap: 0; align-items: flex-start; }           /* 펼침면 — 두 쪽이 맞붙는다 */
  .pblank { flex: none; }                                              /* 1쪽을 오른쪽에 놓기 위한 빈 자리 */
  .pslot { position: relative; overflow: hidden; background: #fff; box-shadow: 0 3px 18px rgba(30,20,60,.18); cursor: pointer; flex: none; }
  .pslot.cur { overflow: visible; background: none; box-shadow: none; cursor: default; }
  .pslot .pw { position: absolute; left: 0; top: 0; }
  .pslot .pw svg { display: block; width: 100%; height: auto; }
  .pslot .plb { position: absolute; left: 1px; bottom: -18px; font-size: 11px; color: var(--mute); pointer-events: none; }
  .pslot.cur .plb { color: var(--pp); font-weight: 600; }
  .pslot:not(.cur):hover { outline: 2px solid #c9b6f3; }
  .cv.noflow .prow:not(.cur) { display: none; }
  .paper .svgwrap { position: absolute; left: 0; top: 0; }                /* 대지가 있으면 음수 자리로 넘친다 */
  .paper .svgwrap svg { display: block; width: 100%; height: auto; }
  .paper .svgwrap svg g[data-fi] { cursor: move; }
  .paper .svgwrap svg g[data-fi]:hover { outline: 1.5px dashed #b39cf5; }
  .paper .svgwrap svg g.sel2 { outline: 2px dashed var(--pp); }
  .steps { background: var(--pp-bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; margin-bottom: 9px; }
  .steps .row3 { display: flex; gap: 4px; flex-wrap: wrap; }
  .steps .st { font-size: 10.5px; padding: 2px 6px; border-radius: 99px; background: var(--bg); color: var(--mute); border: 1px solid var(--line); }
  .steps .st.on { background: var(--pp); color: #fff; border-color: var(--pp); font-weight: 700; }
  .steps .st.ok { color: var(--pp); }
  .steps .note { margin-top: 5px; }
  .steps.done { background: #e8f7ef; }
  :root[data-theme="dark"] .steps.done, body.dark .steps.done { background: #16281f; }
  .slots { position: absolute; inset: 0; pointer-events: none; }
  .slots .tag { position: absolute; font-size: 9.5px; line-height: 1.5; background: var(--pp); color: #fff;
    padding: 0 5px; border-radius: 3px; white-space: nowrap; opacity: .82; transform: translateY(-100%); }
  .slots .box { position: absolute; border: 1px dashed var(--pp); border-radius: 2px; opacity: .45; }
  .selbox { position: absolute; border: 2px solid var(--pp); border-radius: 2px; pointer-events: none; display: none; }
  .selbox .lb { position: absolute; left: -2px; top: -18px; font-size: 10px; background: var(--pp); color: #fff; padding: 1px 6px; border-radius: 4px 4px 0 0; white-space: nowrap; }
  .selbox span[data-h] { position: absolute; background: #fff; border: 2px solid var(--pp); border-radius: 4px; pointer-events: auto; }
  .selbox .hd-e { right: -6px; top: 50%; margin-top: -8px; width: 8px; height: 16px; cursor: ew-resize; }
  .selbox .hd-s { bottom: -6px; left: 50%; margin-left: -8px; width: 16px; height: 8px; cursor: ns-resize; }
  .selbox .hd-se { right: -6px; bottom: -6px; width: 10px; height: 10px; cursor: nwse-resize; }
  .selbox.multi { border-style: dashed; }
  .marq { position: absolute; border: 1.5px dashed var(--pp); background: rgba(125,42,232,.07); display: none; pointer-events: none; }
  .paper.draw .svgwrap { cursor: crosshair; }
  .paper.draw .svgwrap svg g[data-fi] { pointer-events: none; }
  .gv, .gh { position: absolute; background: #ff3ea5; display: none; pointer-events: none; }
  .gv { width: 1px; top: 0; bottom: 0; } .gh { height: 1px; left: 0; right: 0; }
  .tools .sep { width: 1px; height: 16px; background: #4a5068; margin: 0 2px; align-self: center; }
  .tools { position: absolute; display: none; gap: 3px; background: #1f2330; border-radius: 8px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 20; }
  .tools button { border: 0; background: transparent; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .tools button:hover { background: #3a3f52; }
  .tools button.x:hover { background: #c0263a; }
  .start { position: absolute; inset: 0; background: #ecebf3; z-index: 12; overflow: auto; padding: 36px 44px 60px; }
  /* 문서 목록일 때는 편집 도구를 다 감춘다 — 파일 고르는 화면과 고치는 화면은 다르다(피그마·캔바) */
  .cv.browsing .left, .cv.browsing .side, .cv.browsing .strip, .cv.browsing .trail, .cv.browsing .ptool { display: none; }
  .cv.browsing .start .cards { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; max-width: 1600px; }
  .start h2 { margin: 0 0 4px; font-size: 20px; }
  .start .sub { color: var(--mute); font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
  .start .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .pcard { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
  .pcard:hover { border-color: var(--pp); box-shadow: 0 6px 20px rgba(125,42,232,.14); }
  .pcard .th { background: #f7f6fb; border-radius: 8px; aspect-ratio: 210 / 297; overflow: hidden; display: flex; align-items: flex-start; }
  .pcard .th svg { width: 100%; height: auto; display: block; }
  .pcard .nm { font-weight: 700; margin-top: 8px; }
  .pcard .ds { color: var(--mute); font-size: 11.5px; margin-top: 2px; }
  .pcard.new { border-style: dashed; display: grid; place-items: center; min-height: 300px; color: var(--pp); font-weight: 700; font-size: 15px; }
  .guide { max-width: 560px; margin: 60px auto; background: #fff; border-radius: 16px; padding: 26px 30px; box-shadow: 0 6px 24px rgba(30,20,60,.1); }
  .guide h3 { font-size: 16px; margin: 0 0 12px; color: #1f2330; }
  .guide ol { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 13.5px; }
  .pv { position: absolute; inset: 0; background: #ecebf3; z-index: 20; display: flex; flex-direction: column; }
  .pv .pvbar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .pv .pvbar .note { flex: 1; }
  .pv .pvbody { flex: 1; overflow: auto; padding: 20px; display: flex; flex-wrap: wrap; gap: 18px; align-content: flex-start; justify-content: center; }
  .chk { position: absolute; right: 16px; top: 50px; width: 380px; max-height: 70vh; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(30,20,60,.18); z-index: 16; padding: 12px 14px; font-size: 12px; }
  .chk h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; } .chk h4 .btn { margin-left: auto; }
  .chk .it { padding: 5px 8px; border-radius: 7px; margin: 3px 0; line-height: 1.4; } .chk .it.error { background: #fde8e8; color: #8a1c1c; } .chk .it.warn { background: #fff4d6; color: #6b4b00; } .chk .it.info { color: var(--mute); }
  .chk .ok { color: #1a7f37; font-weight: 600; }
  .pv .sheet { width: 300px; background: #fff; box-shadow: 0 2px 10px rgba(30,20,60,.15); position: relative; }
  .pv .sheet svg { width: 100%; height: auto; display: block; }
  .pv .sheet .lb { position: absolute; left: 0; top: -16px; font-size: 11px; color: var(--mute); }
  .editbar { display: flex; gap: 10px; align-items: center; background: #1f2330; color: #fff; border-radius: 10px; padding: 8px 14px; margin: 0 auto 12px; max-width: 900px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .editbar .note { color: #c9cbe0; flex: 1; margin: 0; }
  .paper.editing .svgwrap svg g[data-fi]:not(.edt) { opacity: .25; pointer-events: none; }
  .warn { background: #fff7e6; border: 1px solid #f0d9a8; color: #6b4d00; border-radius: 8px; padding: 6px 10px; font-size: 12px; margin: 0 auto 12px; max-width: 760px; white-space: pre-wrap; }
  .empty { color: var(--mute); text-align: center; padding: 80px 20px; font-size: 14px; line-height: 1.7; }

{% block scripts %}
<script src="/static/js/units_compose.js"></script>
<script>
const LIB = {{ library_json | safe }};
const $ = (s) => document.querySelector(s);
window.__busy = 0;                                                    // 서버와 주고받는 중인 요청 수 — 0 이면 화면이 다 바뀐 것(자동 시험이 기다리는 신호)
const api = async (url, body, method) => {
  window.__busy++;
  try {
    const r = await fetch(url, {method: method || (body ? "POST" : "GET"), headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
    const j = await r.json().catch(() => ({error: r.status + " " + r.statusText}));
    if (!r.ok && !j.error) j.error = r.status + " " + r.statusText;
    return j;
  } finally { setTimeout(() => window.__busy--, 50); }                // 받은 뒤 화면을 고치는 시간까지
};
const byId = (k) => Object.fromEntries((LIB[k] || []).map(x => [x.id, x]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const snap = (v) => (typeof view !== "undefined" && view && view.snap === false) ? Math.round(v * 10) / 10 : Math.round(v * 2) / 2;   // 자석을 끄면 0.1mm 까지
const exact = (v) => Math.round(v * 1000) / 1000;                     // 묶기·풀기는 자리를 그대로 — 격자로 반올림하지 않는다(인디자인 그룹, 단위 10 O/X 상자가 0.2~0.34mm 밀렸다)
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const MDEF = {left: 20, right: 20, top: 44, bottom: 20};          // 새 지면 기본 여백
// 지금 지면의 여백 — 지면에 적힌 값이 먼저다(분해해 온 지면은 그 면에서 잰 값이 들어 있다)
// 지면의 여백. 마주보는 책이면 안쪽(제본쪽)·바깥쪽을 그 면이 왼쪽인지 오른쪽인지에 맞춰 좌우로 편다.
function marg(pg) {
  pg = pg || (typeof page !== "undefined" ? page : null) || {};
  const m = Object.assign({}, MDEF, pg.margins || {});
  if (m.inside != null || m.outside != null) {
    const ins = m.inside != null ? m.inside : m.left, out = m.outside != null ? m.outside : m.right;
    if (rightHand(pg)) { m.left = ins; m.right = out; } else { m.left = out; m.right = ins; }   // 오른쪽 면은 왼쪽이 제본쪽
  }
  return m;
}
// 이 지면이 펼쳤을 때 오른쪽 면인가 — 쪽번호가 홀수면 오른쪽 (인디자인과 같다). 낱장 책은 늘 오른쪽으로 본다
function rightHand(pg) {
  if (typeof facing === "function" && !facing()) return true;
  const dp = (typeof docPages === "function") ? docPages() : [];
  const i = dp.findIndex(x => x && pg && x.id === pg.id);
  return i < 0 ? true : (i % 2 === 0);
}
const M = new Proxy({}, {get: (_t, k) => marg()[k]});             // 예전 코드가 M.left 로 읽는다
const BOARD = 20;                 // 대지(pasteboard) mm — 지면 둘레. 인디자인처럼 지면 밖에 요소를 둔다
// 요소 카테고리 — 목록은 catalog/_units/groups.json (만들기·이름 바꾸기·지우기 가능).
// 블록에 group 이 없으면 블록 지도 갈래(B1~B11)로 기본 자리를 잡는다.
const FAMG = {B1: "passage", B2: "passage", B3: "passage", B7: "passage", B6: "question", B5: "drill", B8: "drill", B10: "chrome", B11: "chrome"};
const groupOf = (b) => b.group || (b.source === "system" ? "chrome" : (FAMG[b.family] || ""));
const DEFAULT_TEXT = "텍스트 프레임 — 오른쪽에서 글·크기·색을";
const OLD_DEFAULT_TEXT = "글상자 — 오른쪽에서 글·크기·색을";              // 용어 바꾸기(2026-10-12) 전 문서에 들어 있는 기본 문구
const ATOMS = [
  ["text", "텍스트 프레임", {t: "text", x: 0, y: 0, w: 80, h: 6, font: "$body", size: 9, color: "$ink", text: DEFAULT_TEXT}],
  ["line", "선", {t: "line", x1: 0, y1: 0, x2: 80, y2: 0, stroke: {w: 0.5, color: "$rule"}}],
  ["rect", "사각형", {t: "rect", x: 0, y: 0, w: 60, h: 20, fill: "$gray", radius: 1}],
  ["ellipse", "타원", {t: "ellipse", x: 0, y: 0, w: 10, h: 10, stroke: {w: 0.5, color: "$ink"}}],
  ["image", "그래픽 프레임", {t: "image", x: 0, y: 0, w: 40, h: 30, src: "img1"}],
  ["path", "다각형", {t: "path", x: 0, y: 0, w: 12, h: 12, poly: {n: 6}, d: polyD({n: 6}), fill: "$ink"}],
];
const ATOM_NM = Object.fromEntries(ATOMS.map(a => [a[0], a[1]]));
function polyD(pl) {                                            // 다각형 도구(인디자인) — 면 수 · 별모양 인세트 % → 0~1 비율 경로
  const n = Math.max(3, Math.round(+((pl || {}).n) || 0)); if (!pl || !pl.n) return undefined;
  const st = Math.min(99, Math.max(0, +(pl.star || 0))) / 100, N = st ? n * 2 : n, pts = [];
  for (let k = 0; k < N; k++) { const ang = -Math.PI / 2 + k * Math.PI * 2 / N, r = st && k % 2 ? 1 - st : 1; pts.push([0.5 + 0.5 * r * Math.cos(ang), 0.5 + 0.5 * r * Math.sin(ang)]); }
  return "M" + pts.map(q => q.map(v => v.toFixed(4)).join(" ")).join(" L") + " Z";
}
const plainText = (t) => Array.isArray(t) ? t.map(r => typeof r === "string" ? r : (r.t || "")).join("") : (t || "");

let plan = null, page = null, sel = null, sels = new Set(), scale = 3, zoom = 1, thumbs = {blocks: {}, parts: {}}, pageSvg = {}, curSet = "";
let viewContent = false;                                                  // 원고 보기 — 임시 글 대신 문서에 넣어 둔 원고(core/units/content.py)
const fillArg = () => (viewContent && plan ? {fill: plan.id} : {});
// 틀 = 문서. 아래 띠·←/→·＋ 는 전부 이 틀의 지면 순서 위에서 움직인다. 지면 자체는 라이브러리(공유)에 있다.
function planIds(pl) { const ids = [...(pl.front || [])]; for (const sc of pl.sections || []) { if (sc.divider) ids.push(sc.divider); for (const pg of sc.pages || []) ids.push(pg.page); } ids.push(...(pl.back || [])); return ids; }
function docPages() { return plan ? planIds(plan).map(id => byId("pages")[id]).filter(Boolean) : []; }
// 이 면에 보여 줄 원고 — 고른 원고가 이 면이 받는 유형이 아니면 같은 지문(group)의 그 유형 원고로 (A1 을 골라 두고 A2 면을 보면 A2 의 같은 지문)
function setFor(p) {
  const all = (planPg(p.id) || {}).sets || [];
  if (all.length === 1 && all[0] === "answers") return "answers";          // 정답지 면 — 모은 정답을 보인다
  const kinds = all.filter(k => k !== "answers");
  const cur = (LIB.sets || []).find(s => s.id === curSet);
  if (!kinds.length || !cur || kinds.includes(cur.kind)) return curSet;
  const g = String(cur.group || cur.id);
  const hit = LIB.sets.find(s => kinds.includes(s.kind) && String(s.group || s.id) === g) || LIB.sets.find(s => kinds.includes(s.kind));
  return hit ? hit.id : curSet;
}
const regSeries = () => (plan && plan.catalog && plan.catalog.series) || new URLSearchParams(location.search).get("series") || "";   // 관리에 등록할 폴더(틀) — 한 번 등록했으면 그곳, ＋ 메뉴에서 왔으면 그 폴더
function planPg(pid) { for (const sc of ((plan || {}).sections) || []) for (const pg of sc.pages || []) if (pg.page === pid) return pg; return null; }   // 그 지면의 틀 항목 (앞·뒤붙이엔 없다)
function setPlanIds(ids) { const s0 = (plan.sections || [])[0] || {id: "s1", name: "본문"}; const old = {}; for (const sc of plan.sections || []) for (const pg of sc.pages || []) old[pg.page] = pg;
  plan.front = []; plan.back = []; plan.sections = [{id: s0.id, name: s0.name, pages: ids.map(id => Object.assign({}, old[id], {page: id, repeat: (old[id] || {}).repeat || "once"}))}]; }   // 순서가 바뀌어도 「원고마다」 설정은 남긴다
async function savePlan() { if (!plan) return; const j = await api("/api/units/plans", plan); if (j.error) $("#st").textContent = "문서 저장 실패: " + j.error; return !j.error; }
function usedElsewhere(pid) { return LIB.plans.some(pl => pl !== plan && planIds(pl).includes(pid)); }

const facing = () => !plan || plan.facing !== false;                    // 문서 설정 「페이지 마주보기」 (기본 켬)
const cols = () => (view.spread && facing() && docPages().length > 1) ? 2 : 1;   // 펼침면이면 한 줄에 두 쪽

  const h = (a.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4) / sp.h;
  return Math.max(0.3, view.fit === "width" ? w : Math.min(w, h));   // 전체 = 한 쪽이 다 보이게(스크롤 없음)

// ── 원자들 → 부품 · 부품 → 블록 (단위를 올린다) ──
async function makeTable() {
  // 표 = 머리 행 바탕(면) + 가로·세로 괘선(선) + 칸마다 글상자 — 전부 원자라 옷을 갈아입고 칸을 고칠 수 있다
  const spec = prompt("행, 열, 폭 mm, 행 높이 mm", "3, 4, 170, 7"); if (spec == null) return;
  const [rows, cols, W, RH] = spec.split(/[,\s]+/).map(Number);
  if (!(rows >= 1 && cols >= 1 && W > 0 && RH > 0)) { $("#st").textContent = "행, 열, 폭, 행 높이를 숫자로"; return; }
  const cw = snap(W / cols), H = snap(RH * rows), atoms = [{t: "rect", x: 0, y: 0, w: W, h: RH, fill: "$cream"}];
  for (let r = 0; r <= rows; r++) atoms.push({t: "line", x1: 0, y1: snap(r * RH), x2: W, y2: snap(r * RH), stroke: {w: r === 0 || r === rows ? 0.6 : 0.3, color: "$rule"}});
  for (let c = 0; c <= cols; c++) atoms.push({t: "line", x1: snap(c * cw), y1: 0, x2: snap(c * cw), y2: H, stroke: {w: 0.3, color: "$rule"}});
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    atoms.push({t: "text", x: snap(c * cw), y: snap(r * RH), w: cw, h: RH, font: r === 0 ? "$disp" : "$body", size: 8, color: "$ink", align: "center", valign: "center", inset: [0, 1, 0, 1],
      text: r === 0 ? `머리 ${c + 1}` : `${r}-${c + 1}`, bind: `c${r}_${c + 1}`});
  let n = 1; while (byId("parts")["table_" + n]) n++; const pid = "table_" + n;
  const part = {id: pid, name: `표 ${rows}×${cols}`, w: W, h: H, atoms};
  const j = await api("/api/units/parts", part); if (j.error) { $("#st").textContent = j.error; return; }
  LIB.parts.push(part); place({part: pid}, null, false); thumbsLoad();
}

function atomsOfItem(it) {                                    // 요소·그룹 → 자리 그대로의 원자 요소들 (ungroup 과 같은 셈)
  if (it.atom) return [it];
  const part = it.block ? partOfBlock(it.block) : byId("parts")[it.part]; if (!part) return [];
  const sx = it.w && part.w ? it.w / part.w : 1; const out = [];
  for (const a0 of part.atoms) { const a = clone(a0);
    if (a.t === "line") { const x0 = Math.min(a.x1, a.x2) * sx, y0 = Math.min(a.y1, a.y2); const len = Math.abs(a.x2 - a.x1) * sx, dy = a.y2 - a.y1;
      out.push({atom: Object.assign(a, {x1: 0, y1: dy < 0 ? -dy : 0, x2: exact(len), y2: dy < 0 ? 0 : exact(dy)}), x: exact(it.x + x0), y: exact(it.y + y0)}); }
    else { const x = it.x + a.x * sx, y = it.y + a.y; if (a.t !== "ellipse") a.w = exact(a.w * sx); a.x = 0; a.y = 0; out.push({atom: a, x: exact(x), y: exact(y)}); } }
  return out;
}
async function groupToPart(name) {
  let ids = [...sels].filter(i => page.items[i]).sort((a, b) => a - b); if (!ids.length) return;
  if (ids.some(i => !page.items[i].atom)) {                     // 요소·그룹이 섞였으면 먼저 원자로 펼친다
    hist(); const keep = page.items.filter((_, i) => !ids.includes(i)); const flat = ids.flatMap(i => atomsOfItem(page.items[i]));
    page.items = keep.concat(flat); ids = flat.map((_, k) => keep.length + k); sels = new Set(ids); sel = ids[ids.length - 1];
  }
  if (name == null) { let g = 1; while (byId("parts")["p_" + g]) g++; name = "그룹 " + g; }
  let n = 1; while (byId("parts")["p_" + n]) n++; const pid = "p_" + n;
  const its = ids.map(i => page.items[i]);
  const bb = (it) => { const a = it.atom; const w = a.t === "line" ? Math.abs(a.x2 - a.x1) : a.w, h = a.t === "line" ? Math.abs(a.y2 - a.y1) : a.h; const sx = it.w && w ? it.w / w : 1; return {x: it.x, y: it.y, w: w * sx, h, sx}; };
  const x0 = Math.min(...its.map(it => bb(it).x)), y0 = Math.min(...its.map(it => bb(it).y));
  const atoms = its.map(it => { const a = clone(it.atom), b = bb(it), dx = it.x - x0, dy = it.y - y0;
    if (a.t === "line") { a.x1 = exact(a.x1 * b.sx + dx); a.x2 = exact(a.x2 * b.sx + dx); a.y1 = exact(a.y1 + dy); a.y2 = exact(a.y2 + dy); }
    else { a.x = exact(a.x * b.sx + dx); a.y = exact(a.y + dy); if (a.t !== "ellipse") a.w = exact(a.w * b.sx); } return a; });
  const W = Math.max(...its.map(it => bb(it).x + bb(it).w)) - x0, H = Math.max(...its.map(it => bb(it).y + bb(it).h)) - y0;
  const part = {id: pid, name, w: exact(Math.max(W, 1)), h: exact(Math.max(H, 1)), atoms};
  const j = await api("/api/units/parts", part); if (j.error) { $("#st").textContent = j.error; return; }
  hist(); LIB.parts.push(part); page.items = page.items.filter((_, i) => !ids.includes(i)); page.items.push({part: pid, x: x0, y: y0});
  select([page.items.length - 1]); save(); render(); thumbsLoad();
}
function ungroup() {
  if (sel == null || !page.items[sel]) return;
  const it = page.items[sel];
  if (it.block) {                                            // ③ 블록 → ② 부품 (지금 옷의 모양)
    const part = partOfBlock(it.block); if (!part) return;
    hist(); page.items[sel] = {part: part.id, x: it.x, y: it.y, w: it.w}; save(); render(); side(); return;
  }
  if (it.part) {                                             // ② 부품 → ① 원자들 (자리·폭 그대로)
    const part = byId("parts")[it.part]; if (!part) return;
    const sx = it.w && part.w ? it.w / part.w : 1; const out = [];
    for (const a0 of part.atoms) {
      const a = clone(a0);
      if (a.t === "line") { const x0 = Math.min(a.x1, a.x2) * sx, y0 = Math.min(a.y1, a.y2); const len = Math.abs(a.x2 - a.x1) * sx, dy = a.y2 - a.y1;
        out.push({atom: Object.assign(a, {x1: 0, y1: dy < 0 ? -dy : 0, x2: exact(len), y2: dy < 0 ? 0 : exact(dy)}), x: exact(it.x + x0), y: exact(it.y + y0)}); }
      else { const x = it.x + a.x * sx, y = it.y + a.y; if (a.t !== "ellipse") a.w = exact(a.w * sx); a.x = 0; a.y = 0; out.push({atom: a, x: exact(x), y: exact(y)}); }

}
// ── 요소 안 편집 (더블클릭) — 파워포인트 그룹 안 편집. 풀어서 고치고, 나가면 같은 요소로 다시 묶어 라이브러리를 갱신한다 ──

    else { a.x = snap(a.x * b.sx + dx); a.y = snap(a.y + dy); if (a.t !== "ellipse") a.w = snap(a.w * b.sx); } return a; });
  const W = Math.max(...its.map(it => bb(it).x + bb(it).w)) - x0, H = Math.max(...its.map(it => bb(it).y + bb(it).h)) - y0;

// 원고 항목 씨앗 — contents(yos-workbook-v1)가 보내는 key 그대로. 여기에 원고·블록에서 본 것이 더해진다.
const SEED_ITEMS = [   // [항목 key, 이름, 설명, 자리 조합] — 자리 조합이 있어야 묻지 않고 저절로 붙는다

  ["content-summary", "내용 종합", "(n) 물음 + ①~ 선지", ["no", "prompt", "choices"]],
  ["sentence-order", "문장 배열", "(A)(B)(C) 보기", ["no", "sentences"]],
  ["vocab-blank", "빈칸 어휘", "번호 + 빈칸 문장 + 정답(첫 글자 힌트)", ["no", "sentence", "answer"]],
  ["grammar-choice", "어법 선택", "본문 안 a / b 고르기", ["passage"]],
  ["grammar-ox", "어법 O/X", "번호 + 문장 + O/X", ["no", "sentence", "answer"]],
  ["grammar-fix", "어법 고치기", "틀린 곳에 밑줄", ["no", "sentence", "answer"]],
  ["grammar-blank", "빈칸 어법", "번호 + 빈칸 문장 + 정답", ["no", "sentence", "kr", "answer"]],
  ["writing-order", "영작 배열", "한글 + ( 조각 / 조각 )", ["no", "kr", "sentences"]],
  ["mock-exam", "실전 문제", "발문 + 선지", ["no", "prompt", "choices"]],
  ["outline-text", "본문 정리", "본문 상자 + 정리 줄", ["passage", "sentence"]],
];

// 자리 조합이 같은가 — 이게 「이 요소가 그 원고를 받는다」의 기준
//  a = 그린 요소의 자리, b = 원고 항목·블록의 자리. 정답(answer)만은 요소에 없어도 된다 — 정답은 학생 면에 안 찍고 정답지로 간다
const sameSlots = (a, b) => a.length && b.length && a.every(x => b.includes(x)) && b.every(x => a.includes(x) || x === "answer");
// 이 자리 조합을 쓰는 원고 항목 전부 (항목 key + 같은 모양의 기존 블록 id)
function matchItems(binds) {
  const keys = itemList().filter(k => sameSlots(binds, k.fields)).map(k => k.key);
  const ids = (LIB.blocks || []).filter(b => b.source === "content" && sameSlots(binds, Object.keys(b.fields || {}))).map(b => b.id);
  return [...new Set([...keys, ...ids])];
}
// 고를 수 있는 원고 항목 = 씨앗 + 라이브러리 블록이 받는 것 + 지금 원고에 들어 있는 것
function itemList() {
  const m = new Map();
  for (const [key, name, hint, slots] of SEED_ITEMS) m.set(key, {key: key, name: name, hint: hint, fields: slots || []});
  for (const b of LIB.blocks || []) {
    if (b.source !== "content") continue;
    const fs = Object.keys(b.fields || {});
    for (const acc of (b.accepts || [])) if (!m.has(acc)) m.set(acc, {key: acc, name: acc, hint: "", fields: fs});
    const k = (b.kind || b.name || b.id).trim();
    if (!m.has(k)) m.set(k, {key: k, name: b.name || k, hint: "지금 있는 블록", fields: fs});
    else if (!m.get(k).fields.length) m.get(k).fields = fs;
  }
  for (const st of LIB.sets || []) {
    for (const b of st.blocks || []) {
      const k = b.block;
      const fs = Object.keys(b.fields || {});
      if (!m.has(k)) m.set(k, {key: k, name: (byId("blocks")[k] || {}).name || k, hint: "원고에 있음", fields: fs});
      else if (!m.get(k).fields.length) m.get(k).fields = fs;
    }
  }
  return [...m.values()];
}
// 자리 조합 → 흔한 유형 이름 (원고와 붙는 이름이라 제안해 준다)
const TYPE_BY_SLOT = {passage: "지문 상자", pnum: "지문 번호", prompt: "발문", choices: "선지",
                      sentences: "문장 배열", kr: "빈칸 줄", answers: "정답 줄"};
function suggestName() {
  const binds = [...sels].map(i => page.items[i] && page.items[i].atom && page.items[i].atom.bind).filter(Boolean);
  for (const b of binds) {
    if (TYPE_BY_SLOT[b]) return TYPE_BY_SLOT[b];
  }
  if (binds.includes("sentence") && binds.includes("answer")) return "O/X 줄";
  return "새 블록";
}
function saveAsElement() {
  // 고른 것 → 블록. 이름만 묻고 바로 저장 — 원고 자리가 있으면 그 원고가 들어오고, 없으면 장식.
  const binds = [...sels].map(i => page.items[i] && page.items[i].atom && page.items[i].atom.bind).filter(Boolean);
  const v = prompt("블록 이름", suggestName()); if (v == null || !v.trim()) return;
  const name = v.trim(), accepts = binds.length ? [...new Set([name, ...binds.flatMap(b => b.split("+")), ...matchItems(binds)])] : [];   // 자리 이름(pnum·vocab_sel…)으로도 받는다
  (async () => {
    if (sels.size > 1 || [...sels].every(i => page.items[i] && page.items[i].atom)) { await groupToPart(name); await new Promise(r => setTimeout(r, 150)); }
    if (sel != null && page.items[sel] && page.items[sel].part) await partToBlock(sel, name, name, accepts);
    say(`「${name}」 저장 — 왼쪽 「내가 만든 블록」에서 다른 페이지에 끌어다 쓴다${accepts.length ? "" : " (원고 안 들어오는 장식)"}`);
  })();
}
async function partToBlock(i, name, kind, accepts) {
  const it = page.items[i]; const part = byId("parts")[it.part]; if (!part) return;
  if (name == null) { name = prompt("블록 이름", part.name); if (name == null) return; }
  const fields = {}; for (const a of part.atoms) if (a.bind && !a.bind.startsWith("sys.")) fields[a.bind] = {type: a.bind === "no" ? "number" : (a.bind === "choices" ? "choices" : (a.bind === "answer" ? "answer" : "rich"))};
  let bid = part.id; if (byId("blocks")[bid]) { let n = 1; while (byId("blocks")[part.id + "_" + n]) n++; bid = part.id + "_" + n; }
  const block = {id: bid, name, source: Object.keys(fields).length ? "content" : "none", fields, variants: [{id: "v1", name: "기본", part: part.id}]};
  if (kind) block.kind = kind;                                 // 유형 = 원고와 붙는 이름
  if (accepts && accepts.length) block.accepts = accepts;      // 받는 원고 항목 — 블록 목록이 곧 매칭표
  const j = await api("/api/units/blocks", block); if (j.error) { $("#st").textContent = j.error; return; }
  hist(); LIB.blocks.push(block); page.items[i] = {block: bid, x: it.x, y: it.y, w: it.w}; save(); render(); thumbsLoad(); side();
}

// ── 왼쪽 탭 ──
// 팔레트에서 끌어 놓기 — 포인터 기반(HTML5 DnD 는 브라우저마다 다르고 터치가 안 된다). 6px 넘게 움직이면 끌기, 아니면 누르기(onclick)
function palDrag(el, payload) {

function foldHead(body, title, key, gid) {
  const open = !gFold.has(key);
  body.insertAdjacentHTML("beforeend", `<h3 class="fold" data-g="${esc(gid || "")}" data-k="${esc(key)}"><span class="tw">${open ? "▾" : "▸"}</span>${title}`

  return body.lastElementChild;
}
function foldWire(h, g, key) {
  if (gFold.has(key)) g.style.display = "none";
  h.onclick = (e) => {
    if (e.target.closest("button")) return;                    // ✎ ✕ 는 따로
    const closing = !gFold.has(key);
    if (closing) gFold.add(key); else gFold.delete(key);
    localStorage.setItem("units.gfold", JSON.stringify([...gFold]));
    g.style.display = closing ? "none" : "";
    h.querySelector(".tw").textContent = closing ? "▸" : "▾";

  if (base === "g_") base = "grp";

    if (j.error) { say("가져오기 실패 — " + j.error); return; }
    const lj = await (await fetch("/api/units/library")).json(); for (const k of Object.keys(lj)) LIB[k] = lj[k];
    const r = j.report || {};
    openPlan(byId("plans")[j.plan]); pageSvg = {}; render(); drawRail();
    say(`가져옴 — 페이지 ${r.pages}` + (Object.keys(r.stories_renamed || {}).length ? ` · 스토리 이름 바꿈 ${Object.entries(r.stories_renamed).map(([a, b]) => a + "→" + b).join(", ")}` : "") + ((r.skin_added || []).length ? ` · 스타일 보탬 ${r.skin_added.length}` : ""));
  });
  on("#s-pstart", "change", async (e) => { const v = Math.max(1, Math.round(+e.target.value || 1)); if (v > 1) plan.page_start = v; else delete plan.page_start;
    pageSvg = {}; await savePlan(); render(); drawRail(); side(); });
  on("#s-format", "change", async (e) => { if (e.target.value) plan.format = e.target.value; else delete plan.format; await savePlan(); side(); });
  on("#s-skin-edit", "click", async () => { await ownSkin(); openSheet("skins"); });
  on("#s-set", "change", (e) => { curSet = e.target.value; pageSvg = {}; render(); drawRail(); });
  on("#s-set-edit", "click", () => openSheet("sets"));
  on("#s-map", "click", () => openSheet("map"));
  on("#s-spec", "change", async (e) => {
    if (e.target.value === "__new") {                                   // 새 판형 — 이름·크기를 받아 목록에 넣는다
      const nm = prompt("새 페이지 크기 이름 (영문·숫자·밑줄)", "wb216");
      if (!nm) { e.target.value = page.spec || "a4"; return; }
      const wh = prompt("크기 mm — 폭×높이", "216x303") || "";
      const m = wh.match(/([\d.]+)\s*[x×*]\s*([\d.]+)/);
      if (!m) { say("크기를 216x303 처럼"); e.target.value = page.spec || "a4"; return; }
      const spec = {id: nm.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_"), name: nm.trim(), w: +m[1], h: +m[2], bleed: 3};
      const j = await api("/api/units/specs", spec);
      if (j.error) { say(j.error); e.target.value = page.spec || "a4"; return; }
      LIB.specs.push(spec); page.spec = spec.id; save(); layout(); render(); side(); return;
    }
    page.spec = e.target.value; save(); layout(); render(); });
  on("#s-pname", "input", (e) => { $("#pname").value = e.target.value; $("#pname").oninput(); });
  on("#s-cont", "change", (e) => { hist(); if (e.target.value) page.cont = e.target.value; else delete page.cont; save(); side(); });
  // 레이어 — 만들고 숨기고 잠그고 지운다(요소는 안 지운다)
  on("#s-lay-new", "click", () => {
    const nm = prompt("레이어 이름", "레이어 " + ((page.layers || []).length + 1)); if (nm == null || !nm.trim()) return;
    let n = 1; while ((page.layers || []).some(l => l.id === "l" + n)) n++;
    const lay = (page.layers || []).concat([{id: "l" + n, name: nm.trim()}]);
    for (const p2 of docPages()) { p2.layers = JSON.parse(JSON.stringify(lay)); if (p2 !== page) unsaved.add(p2); }   // 레이어 — 문서 전체(인디자인)
    save(); side();
  });
  box.querySelectorAll("[data-lay]").forEach(i => i.onchange = () => {
    const [lid, key] = i.dataset.lay.split(":"); const l = (page.layers || []).find(x => x.id === lid); if (!l) return;
    if (i.checked) l[key] = true; else delete l[key];
    for (const p2 of docPages()) { if (p2 === page) continue; p2.layers = JSON.parse(JSON.stringify(page.layers)); unsaved.add(p2); }
    save(); render(); side();
  });
  box.querySelectorAll("[data-layx]").forEach(b => b.onclick = () => {
    const lid = b.dataset.layx; const l = (page.layers || []).find(x => x.id === lid); if (!l) return;
    if (!confirm(`레이어 「${l.name}」 을 삭제할까? 그 안의 개체는 레이어 1로 간다(개체는 안 지운다).`)) return;
    for (const p2 of docPages()) { p2.layers = (p2.layers || []).filter(x => x.id !== lid); (p2.items || []).forEach(it => { if (it.atom && it.atom.layer === lid) delete it.atom.layer; }); if (p2 !== page) unsaved.add(p2); }
    save(); render(); side();
  });
  // 기준선 격자
  const grid = () => { const st = +($("#s-grid-start") || {}).value || 0, sp = +($("#s-grid-step") || {}).value || 0;   // 기준선 격자 — 문서 전체(인디자인 환경 설정)
    for (const p2 of docPages()) { if (sp > 0) p2.baseline_grid = {start: st, step: sp}; else delete p2.baseline_grid; if (p2 !== page) unsaved.add(p2); }
    save(); render(); };
  on("#s-grid-start", "change", grid); on("#s-grid-step", "change", grid);
  // 개체 스타일로 저장 — 지금 요소의 모양만 뽑아 옷에 넣는다
  on("#s-ostyle-new", "click", async () => {
    const it = page.items[sel]; if (!it || !it.atom) return;
    const sk = await ownSkin();                                         // 문서마다 자기 스타일
    const nm = prompt("개체 스타일 이름", "스타일 " + (Object.keys(sk.obj_styles || {}).length + 1)); if (nm == null || !nm.trim()) return;
    const keep = ["fill", "gradient", "stroke", "radius", "corner", "tint", "fx", "opacity"];
    const st = {}; keep.forEach(k => { if (it.atom[k] !== undefined) st[k] = clone(it.atom[k]); });
    sk.obj_styles = sk.obj_styles || {}; sk.obj_styles[nm.trim()] = st;
    const j = await api("/api/units/skins", sk); if (j.error) { $("#st").textContent = j.error; return; }
    it.atom.ostyle = nm.trim(); save(); render(); side(); $("#st").textContent = `개체 스타일 「${nm.trim()}」 저장`;
  });
  // 글 안에 개체 끼우기(앵커드)
  on("#s-facing", "change", async (e) => {                        // 문서 설정 — 켜야 펼침면이 생긴다 (인디자인과 같게)
    if (!plan) return; plan.facing = e.target.checked; await savePlan();
    applyView(); layout(); drawPages(); layout(); render(); scrollToActive(); side();
  });
}
$("#pname").oninput = () => { if (page) { page.name = $("#pname").value; save(); const el = document.querySelector(`.pg[data-id="${page.id}"]`); if (el) el.title = page.name || page.id; } };

// ── 저장 ──
let st = null, skt = null;
// 위 컨트롤 바 — 인디자인처럼 고른 것의 자리·크기·정렬을 한 줄에 (오른쪽 패널을 접어도 쓴다)
function ctrlBar() {
  const c = $("#ctrl"), sp = $("#ctrl-sep");
  if (sel == null || !page || !page.items[sel]) { c.innerHTML = ""; sp.style.display = "none"; return; }
  const it = page.items[sel];
  sp.style.display = "";
  c.innerHTML = `<label>X<input data-it="x" type="number" step="0.5" value="${it.x}"></label>`
    + `<label>Y<input data-it="y" type="number" step="0.5" value="${it.y}"></label>`
    + `<label>폭<input data-it="w" type="number" step="0.5" value="${it.w || ""}" placeholder="그대로"></label>`
    + (it.atom ? "" : `<label>%<input data-it="s" type="number" step="5" min="10" value="${Math.round((it.s || 1) * 100)}"></label>`)
    + (sels.size > 1 ? `<span class="sep"></span>` + [["l", "⇤", "왼쪽"], ["c", "⇹", "가로 가운데"], ["r", "⇥", "오른쪽"], ["t", "⤒", "위"], ["m", "⇳", "세로 가운데"], ["b", "⤓", "아래"]]
        .map(([k, ic, t]) => `<button data-cal="${k}" title="${t} 맞춤">${ic}</button>`).join("") : "");
  c.querySelectorAll("[data-cal]").forEach(b => b.onclick = () => align(b.dataset.cal));
}

// 상태줄 — 알려 줄 말은 잠깐 붙잡는다(자동 저장이 바로 덮어 쓰지 않게)
let stHold = 0;
const say = (msg, ms) => { $("#st").textContent = msg; stHold = Date.now() + (ms || 6000); };
const unsaved = new Set();                                              // 저장 기다리는 쪽 — 0.5초 안에 다른 쪽으로 넘어가도 앞 쪽 변경을 잃지 않게
function save() {
  if (!page) return; if (Date.now() > stHold) $("#st").textContent = "저장 중…";
  unsaved.add(page);
  clearTimeout(st); st = setTimeout(async () => { const ps = [...unsaved]; unsaved.clear(); let j = {};
    for (const p of ps) { const r = await api("/api/units/pages", p); if (r.error) j = r; }
    const w = $("#warn");
    if (j.error) { $("#st").textContent = "저장 실패: " + j.error; w.style.display = ""; w.dataset.save = "1"; w.textContent = "저장 안 됨 — " + j.error + " (고칠 때까지 이 페이지의 바뀐 것이 저장되지 않는다)"; }
    else { if (w.dataset.save) { w.style.display = "none"; delete w.dataset.save; } if (Date.now() > stHold) $("#st").textContent = "저장됨"; } }, 500);
}
// 인디자인처럼 문서마다 자기 스타일 · 색상 견본 — 다른 문서도 쓰는 상자(또는 칸이 비어 쓰는 「기본」)는 고치기 전에 이 문서 것으로 복사한다.
// 값이 같아 모양은 그대로이고, 이 뒤로 고친 것은 이 문서에만 든다(2026-10-12 광문 분석본: 한 문서에서 고친 스타일이 다른 문서에 번졌다)
async function ownSkin() {
  const sk = skin();
  if (!plan || !sk.id) return sk;
  const shared = plan.skin !== sk.id || LIB.plans.some(p => p.id !== plan.id && (p.skin || "base") === sk.id);
  if (!shared) return sk;
  let id = "doc_" + plan.id, n = 2; while (byId("skins")[id]) id = "doc_" + plan.id + "_" + n++;
  const c = clone(sk); c.id = id; c.name = (plan.name || plan.id) + " 스타일";
  const j = await api("/api/units/skins", c); if (j.error) { say("스타일 복사 실패: " + j.error); return sk; }
  LIB.skins.push(c); $("#skin").insertAdjacentHTML("beforeend", `<option value="${c.id}">${esc(c.name)}</option>`); $("#skin").value = c.id;
  plan.skin = c.id; await savePlan(); return c;
}
function saveSkin() { clearTimeout(skt); skt = setTimeout(async () => { const j = await api("/api/units/skins", skin()); if (j.error) $("#st").textContent = "스타일 저장 실패: " + j.error; thumbsLoad(); pageSvg = {}; drawRail(); }, 800); }
async function thumbsLoad() { thumbs = await api("/api/units/thumbs?skin=" + encodeURIComponent($("#skin").value || "")); panel(); }
$("#skin").onchange = async () => {
  pageSvg = {}; thumbsLoad(); drawRail(); render(); side();
  if (plan && plan.skin !== $("#skin").value) { plan.skin = $("#skin").value; await savePlan(); }   // 문서에 기억시킨다
};

// ── 목록(select) 고르기 — 운영체제 창 대신 화면 안 목록 ──
// 맥 크롬의 기본 목록은 운영체제 창이라 화면 안에서 다룰 수 없다(화면 없는 크롬·자동 시험에서 사람처럼 고를 수 없었다 2026-10-10).
// 누르면 화면 안 목록을 띄우고, 고르면 select 값을 바꾸고 input·change 를 낸다 — 목록을 쓰는 코드는 그대로.
(() => {
  let menu = null, cur = null, hi = -1;
  const close = () => { if (menu) { menu.remove(); menu = null; cur = null; } };
  const mark = () => {
    if (!menu) return;
    [...menu.children].forEach((d, i) => d.classList.toggle("hi", i === hi));
    const h = menu.children[hi]; if (h) h.scrollIntoView({block: "nearest"});
  };
  const choose = (i) => {
    const sel = cur; close();
    if (!sel || i < 0 || !sel.options[i] || sel.options[i].disabled) return;
    if (sel.selectedIndex !== i) { sel.selectedIndex = i; sel.dispatchEvent(new Event("input", {bubbles: true})); sel.dispatchEvent(new Event("change", {bubbles: true})); }
    if (document.body.contains(sel)) sel.focus();
  };
  const open = (sel) => {
    close(); cur = sel;
    menu = document.createElement("div"); menu.className = "selmenu"; menu.setAttribute("role", "listbox");
    [...sel.options].forEach((o, i) => {
      const d = document.createElement("div");
      d.className = "opt" + (i === sel.selectedIndex ? " on" : "") + (o.disabled ? " dis" : "");
      d.textContent = o.textContent; d.dataset.i = i; d.dataset.value = o.value; d.setAttribute("role", "option");
      d.addEventListener("mousedown", (e) => e.preventDefault());
      d.addEventListener("click", (e) => { e.preventDefault(); choose(i); });
      menu.appendChild(d);
    });
    document.body.appendChild(menu);
    const r = sel.getBoundingClientRect(), H = Math.min(menu.scrollHeight, 320);
    let top = r.bottom + 2; if (top + H > innerHeight - 8) top = Math.max(8, r.top - 2 - H);
    Object.assign(menu.style, {left: Math.min(r.left, innerWidth - 220) + "px", top: top + "px", minWidth: r.width + "px"});
    hi = sel.selectedIndex; mark();
  };
  document.addEventListener("mousedown", (e) => {
    const sel = e.target.closest && e.target.closest("select");
    if (sel && !sel.disabled && !sel.multiple) { e.preventDefault(); sel.focus(); if (cur === sel) close(); else open(sel); return; }
    if (menu && !menu.contains(e.target)) close();
  }, true);
  document.addEventListener("keydown", (e) => {
    const sel = document.activeElement && document.activeElement.tagName === "SELECT" ? document.activeElement : null;
    if (!menu) { if (sel && ["ArrowDown", "ArrowUp", " ", "Enter"].includes(e.key)) { e.preventDefault(); open(sel); } return; }
    if (e.key === "ArrowDown") { e.preventDefault(); hi = Math.min(cur.options.length - 1, hi + 1); mark(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); hi = Math.max(0, hi - 1); mark(); }
    else if (e.key === "Enter") { e.preventDefault(); choose(hi); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); }
  }, true);
  window.addEventListener("scroll", (e) => {                         // 목록을 품은 영역이 굴러갈 때만 닫는다 — 지면이 다시 그려지며 움직이는 스크롤엔 안 닫는다
    if (!menu || menu.contains(e.target)) return;
    const t = e.target === document ? document.documentElement : e.target;
    if (cur && t.contains && t.contains(cur)) close();
  }, true);
  window.addEventListener("resize", close);
})();

// ── 시작 ──
$("#skin").innerHTML =LIB.skins.length ? LIB.skins.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("") : `<option value="">${esc(DEFAULT_SKIN.name)}</option>`;
thumbsLoad();
(() => {
  applyWidths(); applyPanels();                                    // 접어 둔 패널·폭·넓게를 그대로 (localStorage)
  $("#fitsel").value = view.fit || "page";
  const q = new URLSearchParams(location.search); const pl = byId("plans")[q.get("plan") || ""];
  if (pl) openPlan(pl); else if (q.get("new")) { showStart(); newPlan().then(() => { if (plan && q.get("series")) { plan.catalog = {series: q.get("series")}; savePlan(); side(); } }); }   // 관리 ＋ 「편집기 제작」 — 그 폴더로 등록할 새 문서
  else showStart();
  if (view.zoom && view.zoom !== 1) setZoom(view.zoom);            // 확대도 그대로
})();
</script>
