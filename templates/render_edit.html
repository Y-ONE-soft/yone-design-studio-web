<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · 조판 결과</title>
<style>
  /* 조판 결과 확인(routes/api_v1.render_edit) — 왼쪽 찍은 쪽, 오른쪽 원고 글 칸. 원고만 고친다(틀은 편집기에서). */
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #1f2430; background: #eef0f3; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #fff; border-bottom: 1px solid #dde1e7; }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .st { font-size: 12.5px; color: #6b7382; }
  .btn { border: 1px solid #cbd1da; background: #fff; border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: inherit; text-decoration: none; }
  .btn.main { background: #1f2a44; border-color: #1f2a44; color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px 18px; align-items: start; }
  .pages { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .pages img { width: 100%; max-width: 900px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .pages .wait { padding: 60px 0; color: #6b7382; }
  aside { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; background: #fff; border: 1px solid #dde1e7; border-radius: 12px; padding: 14px; }
  aside h2 { margin: 0 0 4px; font-size: 14px; }
  aside .note { margin: 0 0 12px; font-size: 12px; color: #6b7382; }
  .grp { border-top: 1px solid #eceff3; padding-top: 10px; margin-top: 10px; }
  .grp h3 { margin: 0 0 8px; font-size: 12.5px; color: #6b7382; }
  label { display: block; font-size: 12px; font-weight: 700; color: #6b7382; margin: 8px 0 3px; }
  input, textarea { width: 100%; border: 1px solid #cbd1da; border-radius: 8px; padding: 6px 8px; font: 13px/1.5 inherit; font-family: inherit; color: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>{{ title }}</h1>
  <span class="st" id="st"></span>
  <a class="btn" id="pdf" target="_blank" rel="noopener" hidden>PDF</a>
  <button class="btn main" id="redraw">다시 그리기</button>
</header>
<main>
  <section class="pages" id="pages"><p class="wait">조판 중…</p></section>
  <aside>
    <h2>원고</h2>
    <p class="note">여기서 고친 글로 다시 그립니다. 틀(디자인)과 contents 의 원고는 바뀌지 않습니다.</p>
    <form id="form"></form>
  </aside>
</main>
<script>
const JID = {{ jid|tojson }};
const CONTENT = {{ content_json|safe }};
const API = "/api/v1/renders/";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// 원고 꼴 그대로 글 칸을 만든다 — 맨 위 글(교재명 등) · 구성마다 레코드(한 벌) · 레코드 안 목록은 같은 차례끼리 묶어(지문 번호 + 지문)
function field(path, v) {
  const long = String(v).length > 60 || String(v).includes("\n");
  return long ? `<textarea data-p='${esc(JSON.stringify(path))}'>${esc(v)}</textarea>`
              : `<input data-p='${esc(JSON.stringify(path))}' value="${esc(v)}">`;
}
function build() {
  let h = "";
  const top = Object.entries(CONTENT).filter(([, v]) => typeof v === "string");
  if (top.length) h += `<div class="grp"><h3>책</h3>${top.map(([k, v]) => `<label>${esc(k)}</label>${field([k], v)}`).join("")}</div>`;
  for (const [k, recs] of Object.entries(CONTENT)) {
    if (!Array.isArray(recs)) continue;
    recs.forEach((rec, r) => {
      if (!rec || typeof rec !== "object") return;
      h += `<div class="grp"><h3>${esc(k)}${recs.length > 1 ? ` · ${r + 1}벌` : ""}</h3>`;
      const lists = Object.entries(rec).filter(([, v]) => Array.isArray(v));
      for (const [f, v] of Object.entries(rec)) if (!Array.isArray(v) && typeof v !== "object") h += `<label>${esc(f)}</label>${field([k, r, f], v)}`;
      const n = Math.max(0, ...lists.map(([, v]) => v.length));
      for (let i = 0; i < n; i++)
        for (const [f, v] of lists) if (i < v.length && typeof v[i] !== "object") h += `<label>${esc(f)} ${i + 1}</label>${field([k, r, f, i], v[i])}`;
      h += `</div>`;
    });
  }
  $("#form").innerHTML = h;
}
function collect() {
  const c = JSON.parse(JSON.stringify(CONTENT));
  document.querySelectorAll("[data-p]").forEach((e) => {
    const p = JSON.parse(e.dataset.p);
    let o = c;
    for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = e.value;
  });
  return c;
}
async function status(jid) { return (await fetch(API + jid)).json(); }
async function show(jid) {
  for (;;) {
    const s = await status(jid);
    if (s.status === "queued" || s.status === "running") { $("#st").textContent = `조판 중… ${Math.round(s.elapsed || 0)}초`; await new Promise((r) => setTimeout(r, 1500)); continue; }
    if (s.status !== "done" && s.status !== "done_warn") { $("#st").textContent = "조판 실패" + (s.error ? " — " + s.error : ""); $("#pages").innerHTML = ""; return; }
    const n = (s.result || {}).pages || 0;
    $("#st").textContent = `${n}쪽`;
    $("#pages").innerHTML = Array.from({length: n}, (_, i) => `<img src="${API}${jid}/pages/${i + 1}.png?dpi=150" alt="${i + 1}쪽">`).join("");
    const main = (s.result || {}).main_pdf;
    if (main) { $("#pdf").href = `${API}${jid}/files/${encodeURIComponent(main)}`; $("#pdf").hidden = false; }
    return;
  }
}
$("#redraw").addEventListener("click", async () => {
  $("#redraw").disabled = true;
  try {
    const r = await fetch(API + JID + "/content", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({content: collect()})});
    const j = await r.json();
    if (!r.ok) { $("#st").textContent = j.error || "다시 그리지 못했습니다"; return; }
    location.replace(API + j.job + "/edit");                            // 새 찍기의 화면으로 — 고친 원고가 그 찍기의 원고
  } finally { $("#redraw").disabled = false; }
});
build();
show(JID);
</script>
</body>
</html>
