# Fly.io 배포 설정 — 디자인 스튜디오(조판 엔진 + 디자이너 화면 + /api/v1).
#
# yos-typeset(contents 의 조판 서비스)과 같은 플랫폼·리전이다. 다른 점 하나:
#   조판 서비스는 무상태라 머신을 늘리지만, 스튜디오는 **책·디자인·잡이 /data 볼륨에** 있고
#   잡 등록부가 프로세스 메모리에 있어 **머신 1대**로 돈다. (fly scale count 1)
#   조판이 겹치면 스레드로 순서대로 처리된다 — 디자이너 몇 명 규모엔 충분하다.
#
# 배포: deploy/README.md 의 "Fly.io 에 올리기" — 요약
#   fly apps create yos-studio --org personal
#   fly volumes create studio_data --region nrt --size 10
#   fly secrets set YOS_LINK_SECRET=… SERVICE_TOKEN=… YONE_SECRET_KEY=… YOS_LOGIN_URL=… YOS_ORIGINS=… BLOB_READ_WRITE_TOKEN=…
#   fly deploy
#   deploy/fonts-pack.sh && fly ssh sftp put fonts.tgz /data/fonts.tgz && fly ssh console -C "tar xzf /data/fonts.tgz -C /data/fonts"
app = "yos-studio"
primary_region = "nrt"   # 도쿄 — yos-typeset 과 같다

[build]
  dockerfile = "Dockerfile"

[env]
  YONE_PUBLIC_URL = "https://yos-studio.fly.dev"   # 웹훅·카탈로그 안의 절대 링크. 도메인을 붙이면 바꾼다
  YONE_THREADS = "16"
  YONE_LOG_LEVEL = "info"

[mounts]
  source = "studio_data"   # fly volumes create studio_data --region nrt --size 10
  destination = "/data"    # 책 폴더 · 카탈로그 · 잡 기록 · 서체 · ICC

[http_service]
  internal_port = 5099
  force_https = true
  auto_stop_machines = false   # 볼륨 달린 단일 머신 — 잠들면 조판 잡이 끊긴다
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 32
    hard_limit = 64

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"   # chromium 포함 이미지 + 카탈로그 시드

[[vm]]
  memory = "2gb"           # chromium 조판 — yos-typeset 과 같다. 큰 책(300면+)에서 죽으면 4gb
  cpu_kind = "shared"
  cpus = 2
